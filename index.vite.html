<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Content Security Policy (enforcing). Same-origin only — the app makes no
       cross-origin requests (recipes load from the same-origin bundle; the old
       cross-origin GitHub recipe sync was removed for supply-chain integrity).
       'unsafe-inline' is required for the app's inline React styles; no eval in the
       bundle so script-src stays 'self'; font-src allows data: because Vite inlines
       small @fontsource woff2 subsets. NOTE: frame-ancestors / report-to are
       header-only (ignored in <meta>) — set those on the nginx response when
       promoting this. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'" />
  <title>bioinfospace labmate</title>
  <!-- %BASE_URL% (not a bare-relative href) — these must resolve from the app
       root regardless of how many /locale/tab segments deep the current page
       is (relative hrefs would 404 on a direct load of e.g. /labmate/en/calc,
       since that's one path segment deeper than the old unprefixed routes). -->
  <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
  <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
  <link rel="manifest" href="%BASE_URL%manifest.json" />
  <meta name="theme-color" content="#16B364" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <!-- Fonts are self-hosted via @fontsource (imported in src/main.jsx) — no remote font origin -->

</head>
<body>
  <div class="grain"></div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
