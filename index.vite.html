<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Content Security Policy (enforcing). Cross-origin is allow-listed narrowly:
       connect-src adds raw.githubusercontent.com (the recipe library + its signed
       manifest, verified fail-closed app-side — see recipeVerify.js) and
       cloudflareinsights.com (Cloudflare Web Analytics beacon reporting);
       script-src adds static.cloudflareinsights.com (the beacon script, injected
       at the Cloudflare edge). 'unsafe-inline' is required for the app's inline
       React styles; no eval in the bundle. font-src allows data: because Vite
       inlines small @fontsource woff2 subsets. NOTE: keep connect-src/script-src
       in sync with the nginx response header; frame-ancestors / report-to are
       header-only (ignored in <meta>).
       BYOK (assistant "bring your own key") adds the preset provider hosts to
       connect-src — OpenRouter, Groq, DeepSeek, Gemini, Anthropic — plus the
       localhost ports for Ollama (11434) and LM Studio (1234). A CUSTOM BYOK
       endpoint beyond these needs its host appended here (and in the nginx
       header) when self-hosting — see README "The Assistant". -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://raw.githubusercontent.com https://cloudflareinsights.com https://openrouter.ai https://api.groq.com https://api.deepseek.com https://generativelanguage.googleapis.com https://api.anthropic.com http://localhost:11434 http://localhost:1234; worker-src 'self'; manifest-src 'self'" />
  <title>bioinfospace labmate</title>
  <!-- %BASE_URL% (not a bare-relative href) — these must resolve from the app
       root regardless of how many /locale/tab segments deep the current page
       is (relative hrefs would 404 on a direct load of e.g. /labmate/en/calc,
       since that's one path segment deeper than the old unprefixed routes). -->
  <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
  <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
  <link rel="manifest" href="%BASE_URL%manifest.json" />
  <meta name="theme-color" content="#16B364" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <!-- Fonts are self-hosted via @fontsource (imported in src/main.jsx) — no remote font origin -->

</head>
<body>
  <div class="grain"></div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
