name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /labmate/

      - name: Deploy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "dist/*"
          target: "/tmp/labmate-deploy"
          strip_components: 1

      - name: Swap into production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            DEST=/var/www/apps.bioinfospace.com/labmate
            # Ensure ubuntu owns the deploy target — prior sudo deploys left root-owned files
            # under assets/, causing rsync to fail with EACCES on subsequent ubuntu deploys.
            sudo chown -R ubuntu:ubuntu "$DEST"
            rsync -rlgoDzvc --delete /tmp/labmate-deploy/ "$DEST/"
            cd /home/ubuntu/.openclaw/workspace-pm/labmate-repo
            git pull --ff-only origin main
            cp recipes.json "$DEST/"
            cp sw.js "$DEST/" 2>/dev/null || cp public/sw.js "$DEST/"
            # Cache-bust asset URLs in index.html (defeats stale Cloudflare 404s
            # cached from the brief window when a hashed asset didn't exist yet).
            BUSTER="$(date -u +%Y%m%dT%H%M%SZ)"
            sed -i "s|/labmate/assets/\\([^\"]*\\)|/labmate/assets/\\1?v=$BUSTER|g" "$DEST/index.html"
            rm -rf /tmp/labmate-deploy
