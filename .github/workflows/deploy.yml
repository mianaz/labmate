name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /labmate/

      - name: Deploy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "dist/*"
          target: "/tmp/labmate-deploy"
          strip_components: 1

      - name: Swap into production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            rsync -rlgoDzvc --delete /tmp/labmate-deploy/ /var/www/apps.bioinfospace.com/labmate/
            cd /home/ubuntu/.openclaw/workspace-pm/labmate-repo
            git pull --ff-only origin main
            cp recipes.json /var/www/apps.bioinfospace.com/labmate/
            cp sw.js /var/www/apps.bioinfospace.com/labmate/ 2>/dev/null || cp public/sw.js /var/www/apps.bioinfospace.com/labmate/
            rm -rf /tmp/labmate-deploy
