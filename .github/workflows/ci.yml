name: CI
on: [push, pull_request]

# Read-only token and SHA-pinned actions, matching deploy.yml.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test -- --run

  # WeChat mini program (weapp/): generated files in sync with the web app,
  # WXML/WXSS compile with WeChat's wcc/wcsc, page render tests.
  weapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: weapp/package-lock.json
      - run: npm ci
      - run: npm run verify
