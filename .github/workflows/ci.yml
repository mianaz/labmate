name: CI
on: [push, pull_request]

# Read-only token and SHA-pinned actions, matching deploy.yml.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test -- --run

  # The app's bundled recipes.json comes from the published, signed library in
  # mianaz/labmate-recipes. Fail when the app's "Refresh" would reject that
  # library: it doesn't verify, or it lacks a recipe this app ships (recipes
  # added to the app alone are how the two drifted apart before).
  recipes-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run recipes:check
