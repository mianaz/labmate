const _gistCryptoSalt = new TextEncoder().encode('labmate-gist-v1');

async function _gistDeriveKey(passphrase) {
  const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: _gistCryptoSalt, iterations: 310000, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

async function _gistEncrypt(plaintext, passphrase) {
  const key = await _gistDeriveKey(passphrase);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plaintext));
  const buf = new Uint8Array(iv.length + ct.byteLength);
  buf.set(iv, 0);
  buf.set(new Uint8Array(ct), iv.length);
  return btoa(String.fromCharCode(...buf));
}

async function _gistDecrypt(base64, passphrase) {
  const raw = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
  const iv = raw.slice(0, 12);
  const ct = raw.slice(12);
  const key = await _gistDeriveKey(passphrase);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return new TextDecoder().decode(pt);
}

function _gistCollectData() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith('labmate_') || key.startsWith('biolab_') || key.startsWith('stepProgress_') || ['favs', 'lang', 'theme'].includes(key)) {
      try { data[key] = JSON.parse(localStorage.getItem(key)); }
      catch { data[key] = localStorage.getItem(key); }
    }
  }
  return JSON.stringify({ exportedAt: new Date().toISOString(), appVersion: 'v0.1.0', data });
}

function PlateTableView({ wellData, config, lang }) {
  const [showTable, setShowTable] = useState(false);
  const [sortCol, setSortCol] = useState('well');
  const [sortAsc, setSortAsc] = useState(true);

  const rows = useMemo(() => {
    const entries = Object.entries(wellData).map(([key, data]) => ({
      well: key,
      row: key[0],
      col: parseInt(key.slice(1)),
      label: data.label,
      color: data.color,
    }));
    entries.sort((a, b) => {
      let cmp = 0;
      if (sortCol === 'well') cmp = a.well.localeCompare(b.well, undefined, { numeric: true });
      else if (sortCol === 'row') cmp = a.row.localeCompare(b.row) || a.col - b.col;
      else if (sortCol === 'col') cmp = a.col - b.col || a.row.localeCompare(b.row);
      else if (sortCol === 'label') cmp = a.label.localeCompare(b.label);
      return sortAsc ? cmp : -cmp;
    });
    return entries;
  }, [wellData, sortCol, sortAsc]);

  function toggleSort(col) {
    if (sortCol === col) setSortAsc(!sortAsc);
    else { setSortCol(col); setSortAsc(true); }
  }

  const sortArrow = (col) => sortCol === col ? (sortAsc ? ' ↑' : ' ↓') : '';

  if (!showTable) {
    return (
      <div className="mt-4 flex justify-center">
        <button onClick={() => setShowTable(true)}

        <table className="w-full text-sm">
          <thead className="sticky top-0" style={{background:'var(--card)'}}>
            <tr className="border-b" style={S_BORDER}>
              {[{id:'well',l:'Well'},{id:'row',l:'Row'},{id:'col',l:'Col'},{id:'label',l:'Label'},{id:'color',l:'Color'}].map(h => (
                <th key={h.id} onClick={() => toggleSort(h.id)}
                  className="text-left py-2 px-2 text-xs cursor-pointer select-none"

function PlateTab() {
  const lang = useLang();
  const toast = useToast();
  const [plateType, setPlateType] = useState(96);
  const [wellData, setWellData] = useState({});
  const [selectedWells, setSelectedWells] = useState(new Set());
  const [currentColor, setCurrentColor] = useState(0);
  const [customColor, setCustomColor] = useState('#ff0000');
  const [useCustomColor, setUseCustomColor] = useState(false);
  const [currentLabel, setCurrentLabel] = useState('');
  const [isDragging, setIsDragging] = useState(false);
  const [groups, setGroups] = useState([]);
  const [enlarged, setEnlarged] = useState(false);

  const config = PLATE_CONFIGS[plateType];

  useEffect(() => {
    setWellData({});
    setSelectedWells(new Set());
    setGroups([]);
  }, [plateType]);

  function wellKey(r, c) { return `${ROW_LABELS[r]}${c + 1}`; }

  function toggleWell(r, c) {
    const key = wellKey(r, c);
    setSelectedWells(prev => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  }

  function handleMouseDown(r, c, e) {
    e.preventDefault();
    setIsDragging(true);
    toggleWell(r, c);
  }

  function handleMouseEnter(r, c) {
    if (isDragging) {
      const key = wellKey(r, c);
      setSelectedWells(prev => {
        const next = new Set(prev);
        next.add(key);
        return next;
      });
    }
  }

  useEffect(() => {
    function handleUp() { setIsDragging(false); }
    window.addEventListener('mouseup', handleUp);
    return () => window.removeEventListener('mouseup', handleUp);
  }, []);

  function getActiveColor() {
    return useCustomColor ? customColor : WELL_COLORS[currentColor % WELL_COLORS.length];
  }

  function assignSelected() {
    if (selectedWells.size === 0 || !currentLabel) return;
    const color = getActiveColor();
    setWellData(prev => {
      const next = { ...prev };
      selectedWells.forEach(key => {
        next[key] = { color, label: currentLabel };
      });
      return next;
    });
    const existingIdx = groups.findIndex(g => g.label === currentLabel);
    if (existingIdx === -1) {
      setGroups(prev => [...prev, { label: currentLabel, color, wells: [...selectedWells] }]);
    } else {
      setGroups(prev => prev.map((g, i) => i === existingIdx
        ? { ...g, wells: [...new Set([...g.wells, ...selectedWells])] }
        : g
      ));
    }
    setSelectedWells(new Set());
    setCurrentLabel('');
    if (!useCustomColor) setCurrentColor(prev => prev + 1);
  }

  function clearAll() {
    setWellData({});
    setSelectedWells(new Set());
    setGroups([]);
    setCurrentColor(0);
  }

  function selectRow(r) {
    setSelectedWells(prev => {
      const next = new Set(prev);
      for (let c = 0; c < config.cols; c++) next.add(wellKey(r, c));
      return next;
    });
  }

  function selectCol(c) {
    setSelectedWells(prev => {
      const next = new Set(prev);
      for (let r = 0; r < config.rows; r++) next.add(wellKey(r, c));
      return next;
    });
  }

  // Template dialog state
  const [templateDialog, setTemplateDialog] = useState(null);
  const [templateParams, setTemplateParams] = useState({});

  function openTemplate(type) {
    const defaults = {
      serial: { startConc: '100', factor: '2', direction: 'row', replicates: '1' },
      checkerboard: { label1: 'Treatment', label2: 'Control', replicates: '1' },
      dose: { drugs: '3', startConc: '100', dilFactor: '3', replicates: '1' },
      control: {},
      antibody: { antibodies: '3', startConc: '100', dilFactor: '2' },
    };
    setTemplateParams(defaults[type]);
    setTemplateDialog(type);
  }

  function updateParam(key, val) {
    setTemplateParams(prev => ({ ...prev, [key]: val }));
  }

  function confirmTemplate() {
    if (templateDialog === 'serial') applySerialDilution();
    else if (templateDialog === 'checkerboard') applyCheckerboard();
    else if (templateDialog === 'dose') applyDoseResponse();
    else if (templateDialog === 'control') applyControlLayout();
    else if (templateDialog === 'antibody') applyAntibodyTitration();
    setTemplateDialog(null);
  }

  // Serial dilution template with replicates
  function applySerialDilution() {
    const startConc = templateParams.startConc;
    const factor = templateParams.factor;
    const direction = templateParams.direction;
    const reps = Math.max(1, Math.min(4, +(templateParams.replicates || 1)));
    if (!startConc || !factor) return;

    const newData = {};
    const newGroups = [];
    let conc = +startConc;
    const f = +factor;

    if (direction === 'row') {
      const steps = config.cols;
      const rowsPerStep = reps;
      for (let c = 0; c < steps; c++) {
        const label = conc >= 1 ? conc.toFixed(1) : conc.toExponential(1);
        const color = WELL_COLORS[c % WELL_COLORS.length];
        const wells = [];
        for (let rep = 0; rep < rowsPerStep && rep < config.rows; rep++) {
          for (let r = rep; r < config.rows; r += Math.max(1, Math.floor(config.rows / rowsPerStep))) {
            if (wells.length >= config.rows) break;
          }
        }
        for (let r = 0; r < Math.min(reps, config.rows); r++) {
          const key = wellKey(r, c);
          newData[key] = { color, label };
          wells.push(key);
        }
        if (reps === 1) {
          for (let r = 0; r < config.rows; r++) {
            const key = wellKey(r, c);
            newData[key] = { color, label };
            if (!wells.includes(key)) wells.push(key);
          }
        }
        newGroups.push({ label, color, wells });
        conc /= f;
      }
    } else {
      const steps = config.rows;
      for (let r = 0; r < steps; r++) {
        const label = conc >= 1 ? conc.toFixed(1) : conc.toExponential(1);
        const color = WELL_COLORS[r % WELL_COLORS.length];
        const wells = [];
        const colCount = reps === 1 ? config.cols : Math.min(reps, config.cols);
        for (let c = 0; c < colCount; c++) {
          const key = wellKey(r, c);
          newData[key] = { color, label };
          wells.push(key);
        }
        newGroups.push({ label, color, wells });
        conc /= f;
      }
    }

    setWellData(newData);
    setGroups(newGroups);
    setSelectedWells(new Set());
  }

  // Checkerboard template with replicates
  function applyCheckerboard() {
    const label1 = templateParams.label1;
    const label2 = templateParams.label2;
    const reps = Math.max(1, Math.min(4, +(templateParams.replicates || 1)));
    if (!label1 || !label2) return;
    const newData = {};
    const wells1 = [], wells2 = [];
    for (let r = 0; r < config.rows; r++) {
      for (let c = 0; c < config.cols; c++) {
        const key = wellKey(r, c);
        const blockR = Math.floor(r / reps);
        const blockC = Math.floor(c / reps);
        if ((blockR + blockC) % 2 === 0) {
          newData[key] = { color: WELL_COLORS[0], label: label1 };
          wells1.push(key);
        } else {
          newData[key] = { color: WELL_COLORS[1], label: label2 };
          wells2.push(key);
        }
      }
    }
    setWellData(newData);
    setGroups([
      { label: label1, color: WELL_COLORS[0], wells: wells1 },
      { label: label2, color: WELL_COLORS[1], wells: wells2 },
    ]);
  }

  // Dose-response template with replicates
  function applyDoseResponse() {
    const drugs = templateParams.drugs;
    const startConc = templateParams.startConc;
    const dilFactor = templateParams.dilFactor;
    const reps = Math.max(1, Math.min(4, +(templateParams.replicates || 1)));
    if (!drugs || !startConc || !dilFactor) return;
    const nDrugs = Math.min(+drugs, Math.floor(config.rows / reps));
    const newData = {};
    const newGroups = [];

    for (let d = 0; d < nDrugs; d++) {
      let conc = +startConc;
      const color = WELL_COLORS[d % WELL_COLORS.length];
      const drugLabel = `Drug ${d + 1}`;
      const wells = [];

      for (let c = 0; c < config.cols; c++) {
        const label = conc >= 1 ? conc.toFixed(1) : conc.toExponential(1);
        for (let rep = 0; rep < reps; rep++) {
          const r = d * reps + rep;
          if (r >= config.rows) break;
          const key = wellKey(r, c);
          newData[key] = { color, label };
          wells.push(key);
        }
        conc /= +dilFactor;
      }
      newGroups.push({ label: drugLabel, color, wells });
    }

    setWellData(newData);
    setGroups(newGroups);
  }

  // Control Layout template
  function applyControlLayout() {
    const newData = {};
    const posWells = [], negWells = [], blankWells = [];
    const posColor = WELL_COLORS[2]; // green
    const negColor = WELL_COLORS[1]; // red
    const blankColor = WELL_COLORS[6]; // cyan

    // Last column: positive controls (top half), negative controls (bottom half)
    const lastCol = config.cols - 1;
    const midRow = Math.floor(config.rows / 2);
    for (let r = 0; r < config.rows; r++) {
      const key = wellKey(r, lastCol);
      if (r < midRow) {
        newData[key] = { color: posColor, label: t('platePosCtrl', lang) };
        posWells.push(key);
      } else {
        newData[key] = { color: negColor, label: t('plateNegCtrl', lang) };
        negWells.push(key);
      }
    }
    // First column: blanks
    for (let r = 0; r < config.rows; r++) {
      const key = wellKey(r, 0);
      newData[key] = { color: blankColor, label: t('plateBlank', lang) };
      blankWells.push(key);
    }

    setWellData(newData);
    setGroups([
      { label: t('platePosCtrl', lang), color: posColor, wells: posWells },
      { label: t('plateNegCtrl', lang), color: negColor, wells: negWells },
      { label: t('plateBlank', lang), color: blankColor, wells: blankWells },
    ]);
  }

  // Antibody Titration template
  function applyAntibodyTitration() {
    const nAb = Math.min(+(templateParams.antibodies || 3), config.rows);
    const startConc = +(templateParams.startConc || 100);
    const dilFactor = +(templateParams.dilFactor || 2);
    const newData = {};
    const newGroups = [];

    for (let ab = 0; ab < nAb; ab++) {
      let conc = startConc;
      const color = WELL_COLORS[ab % WELL_COLORS.length];
      const abLabel = `Ab ${ab + 1}`;
      const wells = [];

      for (let c = 0; c < config.cols; c++) {
        const key = wellKey(ab, c);
        const label = conc >= 1 ? conc.toFixed(1) : conc.toExponential(1);
        newData[key] = { color, label };
        wells.push(key);
        conc /= dilFactor;
      }
      newGroups.push({ label: abLabel, color, wells });
    }

    setWellData(newData);
    setGroups(newGroups);
  }

        {Array.from({length: config.rows}, (_, r) => (

            {Array.from({length: config.cols}, (_, c) => {

              return (

                    width: ws, height: ws, minWidth: ws,
                    background: data ? data.color + '30' : '#f9fafb',
                    borderColor: data ? data.color : '#d1d5db',
                    borderWidth: data ? 2 : 1,
                    fontSize: fs,

                  onMouseDown={e => handleMouseDown(r, c, e)}

                      {data.label.length > 5 ? data.label.slice(0,4)+'…' : data.label}

                    <span className="text-gray-300">{key}</span>

                </div>
              );
            })}
          </div>
        ))}
      </div>

  function handleExport() {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key.startsWith('labmate_') || key.startsWith('biolab_') || key.startsWith('stepProgress_') || key.startsWith('stepTracker_') || ['favs', 'lang', 'theme'].includes(key)) {
        try { data[key] = JSON.parse(localStorage.getItem(key)); }
        catch { data[key] = localStorage.getItem(key); }
      }
    }
    const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), appVersion: 'v0.1.0', data }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `labmate-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    localStorage.setItem('labmate_lastExport', String(Date.now()));
  }

  function handleImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.exportedAt || !parsed.data || typeof parsed.data !== 'object') {
          toast.show(t('importError', lang)); return;
        }
        const MERGE_ARRAY_KEYS = ['labmate_customRecipes', 'labmate_customProtocols'];
        let count = 0;
        Object.entries(parsed.data).forEach(([key, value]) => {
          if (MERGE_ARRAY_KEYS.includes(key)) {
            let existing = [];
            try { existing = JSON.parse(localStorage.getItem(key) || '[]'); } catch {}
            const incoming = Array.isArray(value) ? value : [];
            const merged = [...existing];
            const existingIds = new Set(existing.map(item => item.id));
            for (const item of incoming) {
              if (existingIds.has(item.id)) {
                const idx = merged.findIndex(m => m.id === item.id);
                if (idx >= 0) merged[idx] = item;
              } else {
                merged.push(item);
              }
            }
            localStorage.setItem(key, JSON.stringify(merged));
          } else {
            localStorage.setItem(key, typeof value === 'string' ? value : JSON.stringify(value));
          }
          count++;
        });
        toast.show(t('importSuccess', lang).replace('{n}', count));
        setTimeout(() => window.location.reload(), 500);
      } catch {
        toast.show(t('importError', lang));
      }
      if (fileInputRef.current) fileInputRef.current.value = '';
    };

            <div>
              <h3 className="text-sm font-bold">{t('exportTitle', lang)}</h3>
              <p className="text-xs mt-1 leading-relaxed" style={S_MUTED}>{t('exportDesc', lang)}</p>
            </div>
          </div>
          <button onClick={handleExport}
            className="w-full px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition-all hover:opacity-90"
            style={{background:'var(--primary)', color:'white'}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

const INV_KEY = 'labmate_inventory';
function parseTags(str, sep = ',') {
  return str ? str.split(sep).map(s => s.trim()).filter(Boolean) : [];
}

function loadInventory() {
  try {
    const raw = localStorage.getItem(INV_KEY);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    if (typeof parsed !== 'object' || parsed === null) throw new Error('Invalid inventory data');
    return parsed;
  } catch (e) {
    console.error('loadInventory: corrupted data:', e);
    alert(navigator.language.startsWith('zh')
      ? '库存数据已损坏，已重置为空。如有备份文件，请在工具页导入恢复。'
      : 'Inventory data was corrupted and has been reset. If you have a backup, import it from the Tools tab.');
    return {};
  }
}
function saveInventory(data) {
  try { localStorage.setItem(INV_KEY, JSON.stringify(data)); }
  catch (e) {
    console.error('saveInventory failed:', e);
    alert(navigator.language.startsWith('zh')
      ? '存储空间已满，无法保存库存数据。请先在工具页导出备份，然后清理浏览器数据。'
      : 'Storage quota exceeded — inventory data could not be saved. Please export a backup from the Tools tab and clear browser data.');
  }
}
function getInvData() {
  const d = loadInventory();
  if (!d.locations) d.locations = [];
  if (!d.boxes) d.boxes = [];
  if (!d.samples) d.samples = [];
  if (!d.nextId) d.nextId = { locations: 1, boxes: 1, samples: 1 };
  return d;
}
function nextInvId(data, type) {
  const id = data.nextId[type] || 1;
  data.nextId[type] = id + 1;
  return id;
}

function invExportAllCsv(data, lang) {
  const rows = [['Location', 'Box', 'Position', 'Name', 'Type', 'Quantity', 'Concentration', 'Passage', 'Date Stored', 'Expiry', 'Owner', 'Tags', 'Description', 'Notes']];
  data.samples.forEach(s => {
    const box = data.boxes.find(b => b.id === s.boxId);
    const loc = box ? data.locations.find(l => l.id === box.locationId) : null;
    rows.push([
      loc ? loc.name : '', box ? box.name : '', s.position || '', s.name || '',
      s.sampleType || '', s.quantity || '', s.concentration || '', s.passage || '',
      s.dateStored ? new Date(s.dateStored).toISOString().slice(0, 10) : '',
      s.expiryDate ? new Date(s.expiryDate).toISOString().slice(0, 10) : '',
      s.owner || '', (s.tags || []).join('; '), s.description || '', s.notes || ''

  });
  return rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
}

function downloadCsv(content, filename) {
  const blob = new Blob([content], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function parseCsvImport(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());
  return lines.slice(1).map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') { inQ = !inQ; }
      else if (line[i] === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += line[i]; }
    }
    cols.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => { obj[h.toLowerCase().replace(/\s+/g, '')] = (cols[i] || '').replace(/^"|"$/g, ''); });
    return obj;
  });
}

// MAIN APP
function App() {
  const [recipesReady, setRecipesReady] = useState(_recipesLoaded);
  const [activeTab, setActiveTab] = useState('buffers');
  const [searchOpen, setSearchOpen] = useState(false);
  const [searchSelected, setSearchSelected] = useState(null);
  const [navHistory, setNavHistory] = useState([]);
  const [lang, setLang] = useLocalStorage('lang', (navigator.language || '').startsWith('zh') ? 'zh' : 'en');
  const [theme, setTheme] = useLocalStorage('theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const [showOnboarding, setShowOnboarding] = useState(() => !localStorage.getItem('labmate_onboardingDone'));
  const [calcInitialMode, setCalcInitialMode] = useState(null);
  const [showBackupReminder, setShowBackupReminder] = useState(false);
  const [recipeVersion, setRecipeVersion] = useState(0);
  const toast = useToast();

  const GITHUB_RECIPES_URL = 'https://raw.githubusercontent.com/mianaz/labmate-recipes/main/dist/recipes.json';

  const [isSyncing, setIsSyncing] = useState(false);

  const refreshRecipes = useCallback(async () => {
    setIsSyncing(true);
    toast.show(lang === 'zh' ? '正在同步配方...' : 'Syncing recipes...', 'info');
    try {
      let data;
      try {
        const res = await fetch(GITHUB_RECIPES_URL + '?t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        data = await res.json();
      } catch (e) {
        console.warn('GitHub fetch failed, trying local:', e);
        const res2 = await fetch('recipes.json?t=' + Date.now());
        data = await res2.json();
      }
      const oldLen = RECIPES.length;
      RECIPES.length = 0;
      data.forEach(r => RECIPES.push(r));
      Object.keys(RECIPE_BY_ID).forEach(k => delete RECIPE_BY_ID[k]);
      RECIPES.forEach(r => { RECIPE_BY_ID[r.id] = r; });
      BUFFER_RECIPES.length = 0;
      PROTOCOL_RECIPES.length = 0;
      RECIPES.filter(r => BUFFER_CATEGORIES.includes(r.category)).forEach(r => BUFFER_RECIPES.push(r));
      RECIPES.filter(r => r.category === 'protocol').forEach(r => PROTOCOL_RECIPES.push(r));
      PROTOCOL_RECIPES.forEach(r => {
        for (const [subcat, ids] of Object.entries(PROTOCOL_SUBCATEGORIES)) {
          if (ids.includes(r.id)) { PROTOCOL_SUBCAT_BY_ID[r.id] = subcat; break; }
        }
      });
      const newCount = Math.max(0, RECIPES.length - oldLen);
      setRecipeVersion(v => v + 1);
      toast.show(t('recipesUpdated', lang) + ` (${RECIPES.length} total${newCount > 0 ? ', ' + newCount + ' new' : ''})`, 'success');
    } catch (err) {
      console.error('Refresh failed:', err);
      toast.show(lang === 'zh' ? '同步失败' : 'Sync failed', 'error');
    } finally {
      setIsSyncing(false);
    }
  }, [lang, toast]);

  // Auto-backup reminder: show if no export in last 7 days
  useEffect(() => {
    const last = parseInt(localStorage.getItem('labmate_lastExport'), 10);
    if (!last || Date.now() - last > 7 * 24 * 60 * 60 * 1000) setShowBackupReminder(true);
  }, []);

  // Wait for recipes.json to load
  useEffect(() => {
    if (!_recipesLoaded) {
      onRecipesLoaded(() => {
        // Rebuild derived data structures after recipes load
        RECIPES.forEach(r => { RECIPE_BY_ID[r.id] = r; });
        BUFFER_RECIPES.length = 0;
        PROTOCOL_RECIPES.length = 0;
        RECIPES.filter(r => BUFFER_CATEGORIES.includes(r.category)).forEach(r => BUFFER_RECIPES.push(r));
        RECIPES.filter(r => r.category === 'protocol').forEach(r => PROTOCOL_RECIPES.push(r));
        PROTOCOL_RECIPES.forEach(r => {
          for (const [subcat, ids] of Object.entries(PROTOCOL_SUBCATEGORIES)) {
            if (ids.includes(r.id)) { PROTOCOL_SUBCAT_BY_ID[r.id] = subcat; break; }
          }
        });
        setRecipesReady(true);
      });
    }
  }, []);

  const handleCrossNavigate = useCallback((fromTab, fromSelected, targetRecipe) => {
    setNavHistory(prev => [...prev, { tab: fromTab, recipeId: fromSelected }]);
    setSearchSelected(targetRecipe);
    const targetTab = BUFFER_CATEGORIES.includes(targetRecipe.category) ? 'buffers' : 'protocols';
    setActiveTab(targetTab);
  }, []);

  const handleNavBack = useCallback(() => {
    setNavHistory(prev => {
      if (prev.length === 0) return prev;
      const next = [...prev];
      const last = next.pop();
      if (last.recipeId) setSearchSelected(last.recipeId);
      setActiveTab(last.tab);
      return next;
    });
  }, []);

  useEffect(() => {
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
  }, [theme]);

  // Sync <html lang> attribute with language setting
  useEffect(() => {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  }, [lang]);

  // Global keyboard shortcut ⌘K / Ctrl+K
  useEffect(() => {
    function handleKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        setSearchOpen(prev => !prev);
      }
    }
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, []);

  // Show loading state while recipes.json loads
  if (!recipesReady) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{background:'var(--bg)'}}>
        <div className="text-center">
          <div className="inline-block w-8 h-8 border-2 rounded-full animate-spin mb-3" style={{borderColor:'var(--border)', borderTopColor:'var(--primary)'}} />
          <p className="text-sm" style={S_MUTED}>Loading recipes…</p>
        </div>
      </div>
    );
  }

  return (
    <ToastProvider>
    <FavProvider>
    <TimerProvider>
    <LangContext.Provider value={lang}>
    <div className="min-h-screen" style={{background:'var(--bg)', color:'var(--text)'}}>
      <Header activeTab={activeTab} setActiveTab={setActiveTab} onOpenSearch={() => setSearchOpen(true)}
        onRefreshRecipes={refreshRecipes} isSyncing={isSyncing} lang={lang} setLang={setLang} theme={theme} setTheme={setTheme} />
      <GlobalSearchModal isOpen={searchOpen} onClose={() => setSearchOpen(false)}
        onSelect={r => setSearchSelected(r)} onSwitchTab={setActiveTab} />
      <OnboardingModal isOpen={showOnboarding} onClose={() => setShowOnboarding(false)} />
      <main className="max-w-7xl mx-auto px-4 py-6">
        {showBackupReminder && (
          <div className="mb-4 px-4 py-3 rounded-lg flex items-center justify-between gap-3 text-sm" style={{background:'hsl(45,90%,94%)', border:'1px solid hsl(45,80%,70%)', color:'hsl(30,60%,30%)'}}>
            <span>{t('backupReminder', lang)}</span>
            <div className="flex gap-2 flex-shrink-0">
              <button onClick={() => { setActiveTab('tools'); setShowBackupReminder(false); }}
                className="px-3 py-1 rounded-md text-xs font-semibold" style={{background:'var(--primary)', color:'white'}}>{t('backupNow', lang)}</button>
              <button onClick={() => { localStorage.setItem('labmate_lastExport', String(Date.now())); setShowBackupReminder(false); }}
                className="px-3 py-1 rounded-md text-xs font-semibold" style={{background:'transparent', color:'hsl(30,60%,30%)', border:'1px solid hsl(45,80%,70%)'}}>{t('dismissReminder', lang)}</button>
            </div>
          </div>
        )}
        {navHistory.length > 0 && (
          <button onClick={handleNavBack}
            className="mb-3 px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-1.5 transition-colors hover:opacity-80"
            style={{background:'var(--primary-light)', color:'var(--primary)', border:'1px solid var(--border)'}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            {t('backNav', lang)}
          </button>
        )}
        {activeTab === 'buffers' && <div role="tabpanel" id="tabpanel-buffers" aria-labelledby="tab-buffers"><ErrorBoundary><BuffersTab externalSelected={searchSelected} setExternalSelected={setSearchSelected} onCrossNavigate={(recipe) => handleCrossNavigate('buffers', searchSelected, recipe)} /></ErrorBoundary></div>}
        {activeTab === 'protocols' && <div role="tabpanel" id="tabpanel-protocols" aria-labelledby="tab-protocols"><ErrorBoundary><ProtocolsTab externalSelected={searchSelected} setExternalSelected={setSearchSelected} onCrossNavigate={(recipe) => handleCrossNavigate('protocols', searchSelected, recipe)} /></ErrorBoundary></div>}
        {activeTab === 'calc' && <div role="tabpanel" id="tabpanel-calc" aria-labelledby="tab-calc"><ErrorBoundary><CalcTab initialMode={calcInitialMode} /></ErrorBoundary></div>}
        {activeTab === 'plate' && <div role="tabpanel" id="tabpanel-plate" aria-labelledby="tab-plate"><ErrorBoundary><PlateTab /></ErrorBoundary></div>}
        {activeTab === 'tools' && <div role="tabpanel" id="tabpanel-tools" aria-labelledby="tab-tools"><ErrorBoundary><ToolsTab /></ErrorBoundary></div>}
        {activeTab === 'inventory' && <div role="tabpanel" id="tabpanel-inventory" aria-labelledby="tab-inventory"><ErrorBoundary><InventoryTab /></ErrorBoundary></div>}
        {activeTab === 'refs' && <div role="tabpanel" id="tabpanel-refs" aria-labelledby="tab-refs"><ErrorBoundary><RefsTab onReplayTour={() => { localStorage.removeItem('labmate_onboardingDone'); setShowOnboarding(true); }} /></ErrorBoundary></div>}
      </main>
      <footer className="text-center py-8 text-xs border-t" style={{color:'var(--text-muted)', borderColor:'var(--border)'}}>
        <p className="font-semibold">
          Bioinfo<span style={{ background: 'linear-gradient(135deg, hsl(161 69% 37%), hsl(170 60% 45%), hsl(180 55% 50%))', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>Space</span>{' '}
          LabMate v1.0.0
        </p>
        <p className="mt-1 opacity-50">© {new Date().getFullYear()} BioinfoSpace</p>
        <p className="mt-1">
          <a href="https://github.com/mianaz/labmate" target="_blank" rel="noopener noreferrer"
            className="inline-flex items-center gap-1 opacity-50 hover:opacity-80 transition-opacity"
            style={{color:'var(--text-muted)', textDecoration:'none'}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>

}
