<style>
/*
 * BioLab Toolkit — v4
 * Design language: BioinfoSpace main site
 * Bricolage Grotesque + DM Sans + JetBrains Mono
 * Original CSS variable names preserved for JSX compatibility
 */

:root {
  /* ── Main site light palette ─────────────────────── */
  --bg:           hsl(40, 20%, 99%);
  --bg-2:         hsl(170, 20%, 95%);
  --card:         hsl(40, 15%, 98%);
  --primary:      hsl(161, 69%, 37%);
  --primary-hover:hsl(168, 55%, 32%);
  --primary-light:hsl(170, 20%, 95%);
  --accent:       hsl(168, 55%, 22%);
  --accent-light: hsl(170, 30%, 94%);
  --text:         hsl(200, 25%, 10%);
  --text-muted:   hsl(200, 12%, 44%);
  --border:       hsl(200, 15%, 90%);
  --nav-bg:       hsla(40, 20%, 99%, 0.85);
  --shadow:       0 1px 3px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
  --shadow-lg:    0 20px 40px -12px hsla(168,55%,26%,0.12), 0 8px 16px -8px rgba(0,0,0,0.06);

  /* ── Gradient tokens (main site) ─────────────────── */
  --grad-primary: linear-gradient(135deg, hsl(168,65%,40%), hsl(180,60%,50%), hsl(195,55%,55%));
  --grad-tab:     linear-gradient(90deg, hsl(161,69%,37%), hsl(165,60%,42%), hsl(175,55%,48%));

  /* ── Design tokens ────────────────────────────────── */
  --radius:       0.625rem;
  --font-heading: "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
  --font-body:    "DM Sans", system-ui, -apple-system, sans-serif;
  --font-mono:    "JetBrains Mono", ui-monospace, "SF Mono", monospace;
}

/* ── Dark mode ──────────────────────────────────────── */
[data-theme="dark"] {
  --bg:           hsl(210, 30%, 6%);
  --bg-2:         hsl(210, 20%, 14%);
  --card:         hsl(210, 25%, 9%);
  --primary:      hsl(161, 65%, 48%);
  --primary-hover:hsl(161, 65%, 54%);
  --primary-light:hsl(161, 30%, 15%);
  --accent:       hsl(170, 15%, 92%);
  --accent-light: hsl(175, 25%, 16%);
  --text:         hsl(200, 15%, 95%);
  --text-muted:   hsl(200, 12%, 60%);
  --border:       hsl(210, 18%, 16%);
  --nav-bg:       hsla(210, 30%, 6%, 0.85);
  --shadow:       0 1px 3px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.2);
  --shadow-lg:    0 20px 40px -12px hsla(161,65%,48%,0.15), 0 8px 16px -8px rgba(0,0,0,0.3);
}

/* prefers-color-scheme removed — theme controlled exclusively via data-theme attribute + toggle button */

/* ── Base ───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
}

/* ── Typography ──────────────────────────────────────── */
h1, h2, h3, h4 {
  font-family: var(--font-heading);
  font-variation-settings: "opsz" 32;
  letter-spacing: -0.03em;
  line-height: 1.2;
}

h2.text-xl, h2.font-bold {
  font-size: 1.85rem !important;
  font-weight: 700 !important;
  font-variation-settings: "opsz" 48 !important;
  letter-spacing: -0.04em !important;
}

h3.text-lg {
  font-size: 1.15rem !important;
  font-weight: 600 !important;
  font-variation-settings: "opsz" 24 !important;
}

h3.font-semibold, h3.font-bold {
  font-family: var(--font-body) !important;
  font-size: 0.875rem !important;
  font-weight: 600 !important;
  letter-spacing: 0 !important;
}

h4.font-bold, h4.text-sm {
  font-family: var(--font-body) !important;
  font-size: 0.68rem !important;
  font-weight: 600 !important;
  letter-spacing: 0.08em !important;
  text-transform: uppercase !important;
  color: var(--text-muted) !important;
}

/* ── Nav — glass-strong (main site pattern) ─────────── */
nav {
  background: var(--nav-bg) !important;
  backdrop-filter: blur(20px) saturate(1.8) !important;
  -webkit-backdrop-filter: blur(20px) saturate(1.8) !important;
  border-bottom: 1px solid var(--border) !important;
  box-shadow: 0 1px 0 hsla(168, 55%, 26%, 0.06) !important;
}

nav .font-bold.text-xl, nav h1 {
  font-family: var(--font-heading) !important;
  font-size: 1.15rem !important;
  font-weight: 700 !important;
  font-variation-settings: "opsz" 32 !important;
  letter-spacing: -0.04em !important;
}

/* Brand gradient — main site .text-gradient-primary */
nav .text-primary {
  background: var(--grad-primary) !important;
  -webkit-background-clip: text !important;
  -webkit-text-fill-color: transparent !important;
  background-clip: text !important;
}

/* ── Tabs ────────────────────────────────────────────── */
/* Hide the empty icon spans */
nav span.mr-1\.5 { display: none !important; }

/* Tab indicator — gradient line */
.tab-indicator {
  height: 2px;
  background: var(--grad-tab);
  border-radius: 1px;
  transition: left 0.28s cubic-bezier(0.22, 1, 0.36, 1),
              width 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  position: absolute;
  bottom: 0;
  box-shadow: 0 0 6px hsla(168, 55%, 26%, 0.25);
}

nav button {
  font-family: var(--font-body) !important;
  font-size: 0.875rem !important;
  font-weight: 500 !important;
  padding: 0.9rem 1.2rem !important;
  color: var(--text-muted) !important;
  letter-spacing: 0.01em !important;
  transition: color 0.2s ease !important;
}
nav button:hover { color: var(--text) !important; }
.tab-active { color: var(--primary) !important; font-weight: 600 !important; }

/* ── Cards — feature-card (main site) ───────────────── */
.card {
  background: var(--card) !important;
  border: 1px solid var(--border) !important;
  border-radius: var(--radius) !important;
  box-shadow: var(--shadow) !important;
  position: relative !important;
  overflow: hidden !important;
  transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1) !important;
}
.card.card-scroll {
  overflow-y: auto !important;
}
.card.card-scroll:hover {
  transform: none !important;
}
.card::before {
  content: '' !important;
  position: absolute !important;
  top: 0; left: 0; right: 0 !important;
  height: 3px !important;
  background: var(--grad-tab) !important;
  opacity: 0 !important;
  transition: opacity 0.3s ease !important;
  z-index: 1 !important;
}
.card:hover::before { opacity: 1 !important; }
.card:hover {
  transform: translateY(-2px) !important;
  box-shadow: var(--shadow-lg) !important;
}

/* ── Inputs ──────────────────────────────────────────── */
input[type="number"],
input[type="text"],
input[type="search"],
select,
textarea {
  font-family: var(--font-mono) !important;
  font-size: 0.875rem !important;
  padding: 0.6rem 0.85rem !important;
  border: 1.5px solid var(--border) !important;
  border-radius: calc(var(--radius) - 2px) !important;
  background: var(--bg) !important;
  color: var(--text) !important;
  outline: none !important;
  transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--primary) !important;
  box-shadow: 0 0 0 3px hsla(168, 55%, 26%, 0.1) !important;
}
input::placeholder { color: var(--text-muted) !important; opacity: 1 !important; }

label {
  font-family: var(--font-body) !important;
  font-size: 0.68rem !important;
  font-weight: 600 !important;
  letter-spacing: 0.07em !important;
  text-transform: uppercase !important;
  color: var(--text-muted) !important;
  display: block !important;
  margin-bottom: 0.3rem !important;
}

/* ── Buttons ─────────────────────────────────────────── */
button { font-family: var(--font-body) !important; transition: all 0.2s ease !important; }

/* ── Tables ──────────────────────────────────────────── */
table { font-size: 0.875rem !important; border-collapse: collapse !important; }
thead tr { border-bottom: 1.5px solid var(--border) !important; }
th {
  font-family: var(--font-body) !important;
  font-size: 0.68rem !important; font-weight: 600 !important;
  letter-spacing: 0.07em !important; text-transform: uppercase !important;
  color: var(--text-muted) !important;
  padding: 0.6rem 0.85rem !important; text-align: left !important;
}
td {
  padding: 0.6rem 0.85rem !important;
  border-bottom: 1px solid var(--border) !important;
  font-size: 0.875rem !important;
  color: var(--text) !important;
  vertical-align: middle !important;
}
tr:last-child td { border-bottom: none !important; }
td:not(:first-child) { font-family: var(--font-mono) !important; font-size: 0.82rem !important; }

/* ── Protocol Timeline ───────────────────────────────── */
.protocol-timeline { position: relative; padding-left: 1.75rem; }
.protocol-timeline::before {
  content: ''; position: absolute;
  left: 6.25px; top: 0.5rem; bottom: 0.5rem;
  width: 1.5px; background: var(--border); border-radius: 1px;
}
.protocol-step {
  position: relative; padding: 0.45rem 0 0.75rem;
  font-size: 0.9rem; line-height: 1.65;
}
.protocol-step::before {
  content: ''; position: absolute;
  left: -25px; top: 0.78rem;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--primary);
  border: 2px solid var(--card);
  box-shadow: 0 0 0 1.5px var(--primary-light);
}
.protocol-step.sub-step { padding-left: 0.9rem; font-size: 0.84rem; color: var(--text-muted); }
.protocol-step.sub-step::before {
  width: 5px; height: 5px; left: -23.5px; top: 0.75rem;
  background: var(--border); box-shadow: none; border: none;
}
.protocol-step .step-note {
  display: inline-block; margin-left: 0.4rem;
  font-size: 0.72rem; color: var(--text-muted);
  background: var(--bg-2); padding: 0.1rem 0.45rem;
  border-radius: calc(var(--radius) - 4px); border: 1px solid var(--border);
}
.protocol-step .step-amount {
  font-family: var(--font-mono); font-weight: 500; color: var(--primary);
}

/* ── Well (Plate Designer) ───────────────────────────── */
.well {
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  box-sizing: border-box;
  border-style: solid;
  transition: outline 0.15s ease, transform 0.1s ease;
}
.well:hover { transform: scale(1.08); z-index: 1; }
.well.selected {
  outline: 2.5px solid var(--primary);
  outline-offset: 1.5px;
}

/* ── Mono class ──────────────────────────────────────── */
.mono { font-family: var(--font-mono) !important; }

/* ── Toast ───────────────────────────────────────────── */
.toast-container {
  position: fixed; bottom: 1.25rem; right: 1.25rem; z-index: 9000;
  display: flex; flex-direction: column; gap: 0.4rem; pointer-events: none;
}
.toast {
  pointer-events: auto; padding: 0.65rem 1.1rem;
  border-radius: var(--radius); background: var(--card);
  border: 1px solid var(--border); box-shadow: var(--shadow-lg);
  font-size: 0.82rem; font-weight: 500; color: var(--text);
  animation: toastIn 0.22s cubic-bezier(0.22,1,0.36,1), toastOut 0.22s ease-in 2.78s forwards;
  display: flex; align-items: center; gap: 0.5rem;
}
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.btn-primary { background: var(--primary); color: white; border: 1px solid var(--primary); border-radius: 8px; padding: 6px 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; font-family: var(--font-body); }
.btn-primary:hover { opacity: 0.85; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: var(--font-body); }
.btn-secondary:hover { background: var(--bg-2); }
@keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes toastOut { from { opacity:1; } to { opacity:0; transform:translateY(-4px); } }

/* ── Favorites ───────────────────────────────────────── */
.fav-star { cursor: pointer; transition: transform 0.2s ease, color 0.2s ease; }
.fav-star:hover { transform: scale(1.2); }
.fav-star.active { color: hsl(38, 92%, 50%); }

/* ── Tailwind overrides — light ─────────────────────── */
.bg-gray-50, .bg-gray-100 { background: var(--bg-2) !important; }
.bg-gray-200 { background: var(--border) !important; }
.bg-white { background: var(--card) !important; }
.text-gray-300 { color: hsl(200, 8%, 72%) !important; }
.text-gray-400, .text-gray-500, .text-gray-600 { color: var(--text-muted) !important; }
.text-gray-700, .text-gray-800, .text-gray-900 { color: var(--text) !important; }

.border-amber-200 { border-color: hsl(48,80%,82%) !important; }
.text-amber-800 { color: hsl(32,80%,30%) !important; }
.bg-white\/10, .bg-white\/15, .bg-white\/20 { background: hsla(0,0%,100%,0.6) !important; }
.hover\:bg-gray-100:hover { background: var(--bg-2) !important; }
.hover\:bg-gray-200:hover { background: var(--border) !important; }
.ring-2 { --tw-ring-color: var(--primary) !important; }
.text-primary { color: var(--primary) !important; }
.bg-primary { background: var(--primary) !important; }
.bg-primary-light { background: var(--primary-light) !important; }
.border-primary { border-color: var(--primary) !important; }
.text-accent { color: var(--accent) !important; }

/* ── Tailwind overrides — dark ───────────────────────── */
[data-theme="dark"] .bg-gray-50,
[data-theme="dark"] .bg-gray-100 { background: var(--bg-2) !important; }
[data-theme="dark"] .bg-white { background: var(--card) !important; }

[data-theme="dark"] .text-gray-400,
[data-theme="dark"] .text-gray-500,
[data-theme="dark"] .text-gray-600 { color: var(--text-muted) !important; }
[data-theme="dark"] .text-gray-700,

[data-theme="dark"] .hover\:bg-gray-100:hover { background: var(--bg-2) !important; }
[data-theme="dark"] .hover\:bg-gray-200:hover { background: var(--border) !important; }

/* ── Result numerics ─────────────────────────────────── */
.text-2xl, .text-3xl {
  font-family: var(--font-heading) !important;
  font-variation-settings: "opsz" 40 !important;
  font-weight: 700 !important;
  letter-spacing: -0.03em !important;
}

/* ── Footer ──────────────────────────────────────────── */
footer { border-color: var(--border) !important; font-size: 0.75rem !important; color: var(--text-muted) !important; }

/* ── Scrollbar — main site style ─────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9999px; transition: background 0.2s; }

main > div { animation: cardStaggerIn 0.32s cubic-bezier(0.22,1,0.36,1) both; }

@media print {

.print-only { display: none; }

  guideCalcBody: {
    en: 'Five calculator modes: (1) Dilution — C₁V₁=C₂V₂ with practical pipetting instructions, (2) Mass — how much powder to weigh for a target molarity, (3) Molarity — find the concentration from a known mass, (4) % Solution — w/v or v/v percentage calculations, (5) Prep Calculator — total volume with dead-volume compensation for multi-sample experiments.',
    zh: '五种计算模式：(1) 稀释计算 C₁V₁=C₂V₂ 含实际移液指导，(2) 质量计算——根据目标摩尔浓度算称量量，(3) 摩尔浓度——由已知质量求浓度，(4) 百分比溶液——w/v 或 v/v 计算，(5) 配液计算——多样品实验总量（含 Dead Volume 补偿）。'
  },
  guideGelTitle: { en: 'SDS-PAGE Gel Calculator', zh: 'SDS-PAGE 配胶计算' },
  guideGelBody: {
    en: 'Found inside the Recipes tab under "SDS-PAGE Gel". Choose resolving and stacking gel percentages, set the volume per gel, and specify how many gels. The calculator shows exact volumes of acrylamide, buffer, water, APS, and TEMED. Includes a MW separation range reference table.',
    zh: '位于配方库标签内（点击配胶图标）。选择分离胶和浓缩胶浓度、单胶体积和胶数量，计算器显示丙烯酰胺、缓冲液、水、APS 和 TEMED 的精确用量。附分子量分离范围参考表。'
  },
  guidePlateTitle: { en: 'Plate Designer', zh: '多孔板设计' },
  guidePlateBody: {
    en: 'Design multi-well plate layouts (6, 12, 24, 48, 96, 384-well). Click or drag to select wells, assign labels and colors, then confirm. Use Quick Templates for serial dilution, dose-response, or checkerboard patterns. Export as CSV, SVG image, or copy the layout as text.',
    zh: '设计多孔板布局（6/12/24/48/96/384 孔板）。点击或拖拽选孔，分配标签和颜色后确认。使用快速模板生成梯度稀释、多药物梯度或棋盘格。可导出为 CSV、SVG 图片或复制布局文本。'
  },
  guideShortcutsTitle: { en: 'Keyboard Shortcuts', zh: '键盘快捷键' },
  guideShortcutsBody: {
    en: 'Press ⌘K (Mac) or Ctrl+K (Windows/Linux) to open the global search. Search across all recipes, protocols, reagents, and tags from any tab.',
    zh: '按 ⌘K (Mac) 或 Ctrl+K (Windows/Linux) 打开全局搜索。可在任意标签页搜索所有配方、方案、试剂和标签。'
  },
  guideInventoryTitle: { en: 'Sample Inventory', zh: '样品库存' },
  guideInventoryBody: {
    en: 'Organize lab samples with a hierarchical storage system. Create locations (freezers, fridges, shelves), add boxes (cryo 9×9, 10×10, tip 8×12, etc.), and track samples in a visual grid. Each sample records type, quantity, concentration, passage, dates, owner, and tags. Color-coded by sample type. Export per-box or full inventory as CSV, backup as JSON. All data stored locally in your browser.',
    zh: '使用层级存储系统管理实验室样品。创建存储位置（冰箱、冰柜、架子），添加盒子（冻存盒 9×9、10×10、枪头盒 8×12 等），在可视化网格中追踪样品。每个样品记录类型、数量、浓度、代数、日期、负责人和标签。按样品类型颜色编码。可导出单盒或全部库存为 CSV，备份为 JSON。所有数据存储在浏览器本地。'
  },
  guideCustomTitle: { en: 'Custom Recipes & Protocols', zh: '自定义配方和实验方案' },
  guideCustomBody: {
    en: 'Create your own buffer recipes or protocols using the "New Recipe" / "New Protocol" buttons in the Buffers and Protocols tabs. Custom items are labeled with a "Custom" badge and appear alongside system recipes. Edit or delete them anytime. Custom recipes are included in data exports and cloud backups.',
    zh: '使用缓冲液和实验方案标签页中的"新建配方"/"新建方案"按钮创建自定义配方或方案。自定义条目带有"自定义"标记，与系统配方并列显示。可随时编辑或删除。自定义配方包含在数据导出和云备份中。'
  },
  guideCloudTitle: { en: 'Cloud Backup (GitHub Gist)', zh: '云备份 (GitHub Gist)' },
  guideCloudBody: {
    en: 'Back up all your data to an encrypted GitHub Gist. In the Tools tab, enter a GitHub Personal Access Token and an encryption passphrase. Your data is encrypted with AES-256 before upload — GitHub cannot read it. The passphrase is never stored. You can restore from any browser by entering the same token and passphrase.',
    zh: '将所有数据备份到加密的 GitHub Gist。在工具标签页输入 GitHub 个人访问令牌和加密口令。数据在上传前使用 AES-256 加密——GitHub 无法读取。口令不会被存储。在任何浏览器中输入相同的令牌和口令即可恢复数据。'
  },
  guideDataSafetyTitle: { en: 'Data Safety', zh: '数据安全' },
  guideDataSafetyBody: {
    en: 'All your data (favorites, inventory, custom recipes, step progress) is stored in your browser\'s localStorage. Clearing browser data, switching browsers, or using private/incognito mode will erase everything. Export your data regularly from the Tools tab, or set up Cloud Backup for automatic protection.',
    zh: '所有数据（收藏、库存、自定义配方、步骤进度）均存储在浏览器的 localStorage 中。清除浏览器数据、更换浏览器或使用隐私/无痕模式将删除所有数据。请定期从工具标签页导出数据，或设置云备份以自动保护数据。'
  },
  guideRefsCollapse: { en: 'Literature References', zh: '参考文献' },
  guideRefsCollapseDesc: { en: 'Classic papers and manuals cited in this tool', zh: '本工具所引用的经典论文与手册' },
  guideUsageNotesTitle: { en: 'Usage Notes', zh: '使用说明' },
  guideUsageNote1: { en: 'All buffer recipes are from standard lab manuals and classic papers listed below, widely verified.', zh: '所有 buffer 配方均来自下述标准实验手册和经典论文，经广泛验证。' },
  guideUsageNote2: { en: 'SDS-PAGE gel formulas are based on the Laemmli (1970) discontinuous electrophoresis system.', zh: 'SDS-PAGE 配胶公式基于 Laemmli (1970) 不连续凝胶电泳系统。' },
  guideUsageNote3: { en: 'Transfer buffer is based on the classic Towbin (1979) formula.', zh: '转膜液基于 Towbin (1979) 经典配方。' },
  guideUsageNote4: { en: 'DOI links for original literature can be clicked to go directly to publisher pages.', zh: '各配方的原始文献 DOI 可直接点击跳转至出版商页面。' },
  guideUsageNote5: { en: 'Unit conversions in the calculator follow IUPAC standard definitions.', zh: '计算器中的单位换算遵循 IUPAC 标准定义。' },
  guideUsageNote6: { en: 'We recommend verifying against original literature for your specific experimental needs.', zh: '建议配制前根据实际实验需求与文献原文核对。' },

// ERROR BOUNDARY
// ═══════════════════════════════════════════════

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
  render() {
    if (this.state.hasError) {
      return React.createElement('div', {
        className: 'p-8 text-center',
        style: { color: 'var(--text-muted)' }
      },
        React.createElement('p', { className: 'text-lg font-semibold mb-2' }, 'Something went wrong'),
        React.createElement('p', { className: 'text-sm mb-4' }, this.state.error?.message || 'Unknown error'),
        React.createElement('button', {
          onClick: () => this.setState({ hasError: false, error: null }),
          className: 'px-4 py-2 rounded-lg text-sm font-medium',
          style: { background: 'var(--primary)', color: 'white' }
        }, 'Retry')
      );
    }
    return this.props.children;
  }
}

const ToastContext = createContext({ show: () => {} });
function useToast() { return useContext(ToastContext); }

function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const idRef = useRef(0);
  const show = useCallback((msg, icon = '') => {
    const id = ++idRef.current;
    setToasts(prev => [...prev, { id, msg, icon }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
  }, []);
  return (
    <ToastContext.Provider value={{ show }}>
      {children}
      {createPortal(
        <div className="toast-container">
          {toasts.map(t => <div key={t.id} className="toast">{t.icon && <span>{t.icon}</span>} {t.msg}</div>)}
        </div>,
        document.body
      )}
    </ToastContext.Provider>
  );
}

function useLocalStorage(key, defaultVal) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem('biolab_' + key); return s ? JSON.parse(s) : defaultVal; }
    catch { return defaultVal; }
  });
  const keyRef = useRef(key);
  keyRef.current = key;
  const set = useCallback(v => {
    setVal(prev => {
      const next = typeof v === 'function' ? v(prev) : v;
      try { localStorage.setItem('biolab_' + keyRef.current, JSON.stringify(next)); } catch {}
      return next;
    });
  }, []);
  return [val, set];
}

  try { return JSON.parse(localStorage.getItem('labmate_customRecipes') || '[]'); }

}
function saveCustomRecipes(arr) { localStorage.setItem('labmate_customRecipes', JSON.stringify(arr)); }

const FavContext = createContext({ favs: [], toggle: () => {}, isFav: () => false, recent: [], addRecent: () => {} });
function useFavs() { return useContext(FavContext); }

function FavProvider({ children }) {
  const [favs, setFavs] = useLocalStorage('favorites', []);
  const [recent, setRecent] = useLocalStorage('recent', []);
  const toggle = useCallback(id => {
    setFavs(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  }, [setFavs]);
  const isFav = useCallback(id => favs.includes(id), [favs]);
  const addRecent = useCallback(id => {
    setRecent(prev => {
      const next = [id, ...prev.filter(x => x !== id)].slice(0, 8);
      return next;
    });
  }, [setRecent]);
  return (
    <FavContext.Provider value={{ favs, toggle, isFav, recent, addRecent }}>
      {children}
    </FavContext.Provider>
  );
}

// Safe bold text renderer — avoids dangerouslySetInnerHTML
function BoldText({ text, style }) {
  if (!text) return null;
  const parts = text.split(/\*\*(.*?)\*\*/g);
  return React.createElement('span', { style },
    parts.map((part, i) => i % 2 === 1
      ? React.createElement('strong', { key: i }, part)
      : part
    )
  );
}

function downloadFile(filename, content, mimeType = 'text/plain') {
  const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function renderDynamicStep(text, scale) {
  return text.replace(/\{v:([\d.]+):([^}]+)\}/g, (_, amt, unit) => {
    const scaled = parseFloat(amt) * scale;
    const display = scaled < 0.01 ? scaled.toExponential(2) : scaled < 1 ? scaled.toFixed(2) : scaled < 100 ? scaled.toFixed(1) : Math.round(scaled);
    return display + ' ' + unit;
  });
}

// Unified notes accessor — handles string, {en, zh} object, false, null
// Safe text extractor: handles string, {en,zh} object, or null
function safeText(val, lang) {
  if (!val) return '';
  if (typeof val === 'string') return val;
  if (typeof val === 'object') return (lang === 'en' ? val.en : val.zh) || val.en || val.zh || '';
  return String(val);
}

function getRecipeNotes(recipe, lang) {
  return safeText(recipe.notes, lang);
}

function recipeToText(recipe, targetVol, lang) {
  const scale = targetVol / recipe.defaultVolume;
  let txt = `${'═'.repeat(50)}\n`;
  txt += recipe.name + '\n' + (lang === 'zh' ? recipe.nameCn + '\n' : '');
  if (recipe.ph) txt += `pH: ${recipe.ph}\n`;
  txt += `${'─'.repeat(50)}\n`;
  txt += `目标体积: ${targetVol} ${recipe.unit}`;
  if (scale !== 1) txt += `  (×${scale.toFixed(2)})`;
  txt += '\n\n';
  txt += '试剂'.padEnd(35) + '用量'.padStart(10) + '  单位\n';
  txt += '─'.repeat(50) + '\n';
  (recipe.components || []).forEach(c => {
    const scaled = c.amount * scale;
    const val = scaled < 0.01 ? scaled.toExponential(2) : scaled < 1 ? scaled.toFixed(3) : scaled < 100 ? scaled.toFixed(2) : scaled.toFixed(1);
    txt += c.name.padEnd(35) + val.padStart(10) + '  ' + c.unit;
    if (c.note) txt += '  (' + safeText(c.note, lang) + ')';
    txt += '\n';
  });
  const noteTxt = getRecipeNotes(recipe, 'en'); if (noteTxt) txt += '\nNote: ' + noteTxt + '\n';
  if (recipe.ref) txt += '\nRef: ' + recipe.ref + '\n';
  return txt;
}

function allRecipesToText(recipes) {
  let txt = '╔══════════════════════════════════════════════════╗\n';
  txt +=    '║       BioinfoSpace LabMate — Recipe Collection            ║\n';
  txt +=    '║         Generated: ' + new Date().toISOString().slice(0,10) + '                    ║\n';
  txt +=    '╚══════════════════════════════════════════════════╝\n\n';
  recipes.forEach(r => { txt += recipeToText(r, r.defaultVolume, 'en') + '\n'; });
  return txt;
}

function gelToText(title, data) {
  let txt = title + '\n' + '─'.repeat(50) + '\n';
  txt += '试剂'.padEnd(35) + '用量'.padStart(10) + '  单位\n';
  txt += '─'.repeat(50) + '\n';
  data.forEach(row => {
    const val = row.unit === 'µL' ? row.vol.toFixed(1) : row.vol.toFixed(3);
    txt += row.name.padEnd(35) + val.padStart(10) + '  ' + row.unit + '\n';
  });
  const total = data.reduce((s, r) => s + (r.unit === 'µL' ? r.vol/1000 : r.vol), 0);
  txt += '─'.repeat(50) + '\n';
  txt += 'Total'.padEnd(35) + total.toFixed(2).padStart(10) + '  mL\n';
  return txt;
}

function plateToCSV(wellData, config) {
  const ROW_LABELS = 'ABCDEFGHIJKLMNOP'.split('');
  let csv = ',';
  for (let c = 0; c < config.cols; c++) csv += (c+1) + (c < config.cols-1 ? ',' : '');
  csv += '\n';
  for (let r = 0; r < config.rows; r++) {
    csv += ROW_LABELS[r];
    for (let c = 0; c < config.cols; c++) {
      const key = ROW_LABELS[r] + (c+1);
      const d = wellData[key];
      csv += ',' + (d ? '"' + d.label.replace(/"/g,'""') + '"' : '');
    }
    csv += '\n';
  }
  return csv;
}

function plateToSVG(wellData, config, groups) {
  const ROW_LABELS = 'ABCDEFGHIJKLMNOP'.split('');
  const pad = 40, ws = 32, gap = 4;
  const w = pad + config.cols * (ws + gap) + 20;
  const h = pad + config.rows * (ws + gap) + 60 + groups.length * 20;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" style="font-family:monospace;font-size:10px">`;
  svg += `<rect width="${w}" height="${h}" fill="#f5f2ec"/>`;
  // col headers
  for (let c = 0; c < config.cols; c++) {
    const x = pad + c * (ws + gap) + ws/2;
    svg += `<text x="${x}" y="${pad-8}" text-anchor="middle" fill="#888">${c+1}</text>`;
  }
  // rows
  for (let r = 0; r < config.rows; r++) {
    const y = pad + r * (ws + gap);
    svg += `<text x="${pad-12}" y="${y + ws/2 + 4}" text-anchor="middle" fill="#888">${ROW_LABELS[r]}</text>`;
    for (let c = 0; c < config.cols; c++) {
      const x = pad + c * (ws + gap);
      const key = ROW_LABELS[r] + (c+1);
      const d = wellData[key];
      const fill = d ? d.color + '40' : '#f0f0f0';
      const stroke = d ? d.color : '#ccc';
      svg += `<circle cx="${x+ws/2}" cy="${y+ws/2}" r="${ws/2-2}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
      if (d && config.cols <= 12) {
        const label = d.label.length > 5 ? d.label.slice(0,4)+'…' : d.label;
        svg += `<text x="${x+ws/2}" y="${y+ws/2+3}" text-anchor="middle" fill="${d.color}" font-size="7" font-weight="bold">${label}</text>`;
      }
    }
  }
  // legend
  const ly = pad + config.rows * (ws + gap) + 16;
  svg += `<text x="${pad}" y="${ly}" font-weight="bold" fill="#333">Legend:</text>`;
  groups.forEach((g, i) => {
    const gy = ly + 18 + i * 18;
    svg += `<circle cx="${pad+6}" cy="${gy-4}" r="5" fill="${g.color}"/>`;
    svg += `<text x="${pad+16}" y="${gy}" fill="#555">${g.label} (${g.wells.length} wells)</text>`;
  });
  svg += '</svg>';
  return svg;
}

function GlobalSearchModal({ isOpen, onClose, onSelect, onSwitchTab }) {
  const lang = useLang();

  const [query, setQuery] = useState('');
  const [cachedCustom] = useState(() => ({
    recipes: loadCustomRecipes().map(r => ({...r, _isCustom: true})),
    protocols: loadCustomProtocols().map(r => ({...r, _isCustom: true}))
  }));
  const inputRef = useRef(null);

  useEffect(() => {
    if (isOpen && inputRef.current) {
      inputRef.current.focus();
      setQuery('');
    }
  }, [isOpen]);

  useEffect(() => {
    function handleKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); onClose(); }
      if (e.key === 'Escape' && isOpen) onClose();
    }
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [isOpen, onClose]);

  const results = useMemo(() => {
    if (!query || query.length < 1) return [];
    const q = query.toLowerCase();
    const allRecipes = [...RECIPES, ...cachedCustom.recipes, ...cachedCustom.protocols];
    return allRecipes.map(r => {
      let score = 0;
      const nameMatch = r.name.toLowerCase().includes(q);
      const cnMatch = (r.nameCn || '').includes(q);
      const tagMatch = (r.tags || []).some(t => t.toLowerCase().includes(q));
      const compMatch = (r.components || []).some(c => c.name.toLowerCase().includes(q));
      const noteMatch = (getRecipeNotes(r, 'en') + ' ' + getRecipeNotes(r, 'zh')).toLowerCase().includes(q);
      if (nameMatch) score += 10;
      if (cnMatch) score += 8;
      if (tagMatch) score += 5;
      if (compMatch) score += 6;
      if (noteMatch) score += 2;
      return { recipe: r, score, nameMatch, compMatch, tagMatch };
    }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 15);
  }, [query]);

  if (!isOpen) return null;

  return createPortal(
    <div className="fixed inset-0 z-50 flex items-start justify-center pt-[15vh]"
      onClick={onClose}>
      <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" />
      <div className="relative w-full max-w-2xl mx-4 rounded-2xl overflow-hidden"
        role="dialog" aria-modal="true" aria-label="Search recipes"
        style={{background:'var(--card)', boxShadow:'0 25px 50px -12px rgba(0,0,0,0.25)'}}
        onClick={e => e.stopPropagation()}>
        <div className="flex items-center gap-3 p-4 border-b" style={S_BORDER}>
                    <input ref={inputRef} id="global-search" type="search" value={query} onChange={e => setQuery(e.target.value)}
            placeholder={lang === 'en' ? 'Search recipes, reagents, tags...' : '搜索配方、试剂名、标签...'}
            aria-label="Search recipes"
            className="flex-1 text-base border-none outline-none bg-transparent"
            style={{ fontFamily: "'DM Sans', sans-serif", boxShadow: 'none' }} />
          <kbd className="text-xs px-2 py-1 rounded bg-gray-100 text-gray-400 font-mono">ESC</kbd>
        </div>

        <div className="max-h-[50vh] overflow-y-auto p-2">
          {query && results.length === 0 && (
            <p className="text-center text-gray-400 py-8 text-sm">{t('noResults', lang)}</p>
          )}
          {results.map(({ recipe: r, compMatch, tagMatch }) => {
            const catColors = {
              buffer: { bg: '#e0f2ef', text: '#0b6e63' },
              protocol: { bg: '#f3e8ff', text: '#7c3aed' },
              staining: { bg: '#fef0ec', text: '#d4552a' },
              media: { bg: '#eff6ff', text: '#2563eb' },
            };
            const cc = catColors[r.category] || catColors.buffer;
            return (
              <button key={r.id} onClick={() => { onSelect(r); onSwitchTab(r.category === 'protocol' ? 'protocols' : 'buffers'); onClose(); }}
                className="w-full text-left p-3 rounded-lg hover:bg-gray-50 transition-colors flex items-center gap-3">
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2">
                    <span className="font-semibold text-sm truncate">{r.name}</span>
                    <span className="text-[10px] font-semibold" style={{ color: cc.text }}>{r.category}</span>
                    {r._isCustom && <span className="text-[9px] font-semibold px-1.5 py-0.5 rounded-full" style={{background:'var(--accent-light)', color:'var(--accent)'}}>{t('customBadge', lang)}</span>}
                  </div>
                  {lang === 'zh' && <p className="text-xs text-gray-500 truncate">{r.nameCn}</p>}
                  {compMatch && (
                    <p className="text-[10px] text-amber-600 mt-0.5">
                      {t('searchContains', lang)} {r.components.filter(c => c.name.toLowerCase().includes(query.toLowerCase())).map(c => c.name).join(', ')}
                    </p>
                  )}
                </div>
                <span className="text-gray-300 text-xs">→</span>
              </button>
            );
          })}
          {!query && (
            <div className="text-center py-8 text-gray-400">
              <p className="text-sm mb-2">{t('searchHint', lang)}</p>
              <div className="flex flex-wrap justify-center gap-2 mt-3">
                {['PBS', 'Tris', 'ChIP', 'WB', 'CRISPR', 'RNA', '转膜', '蛋白纯化'].map(tag => (
                  <button key={tag} onClick={() => setQuery(tag)}
                    className="text-xs px-3 py-1 rounded-full bg-gray-100 text-gray-500 hover:bg-primary-light hover:text-primary transition-colors">
                    {tag}
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>

        <div className="p-3 border-t flex items-center justify-between text-[10px] text-gray-400" style={{borderColor:'var(--border)', background:'var(--bg-2)'}}>
          <span>{RECIPES.length} {t('totalRecipes', lang)}</span>
          <span>{t('searchBy', lang)}</span>
        </div>
      </div>
    </div>,
    document.body
  );
}

let RECIPES = [];

function onRecipesLoaded(fn) {
  if (_recipesLoaded) fn();
  else _recipesListeners.push(fn);
}

fetch('recipes.json')
  .then(r => r.json())
  .then(data => {
    RECIPES = data;
    _recipesLoaded = true;
    _recipesListeners.forEach(fn => fn());
    _recipesListeners.length = 0;
  })
  .catch(err => {
    console.error('Failed to load recipes:', err);
  });

// DATA: SDS-PAGE Gel Formulas
// ═══════════════════════════════════════════════

const GEL_DEFAULTS = {
  resolving: {
    trisStock: 1.5,    // M, pH 8.8
    trisVolFrac: 0.25, // 25% of total
    sdsVolFrac: 0.01,  // 1% of 10% SDS stock
    apsVolFrac: 0.01,  // 1% of 10% APS
    temedPerMl: 0.0006,// mL TEMED per mL gel
    acrylamideStock: 30, // % stock
  },
  stacking: {
    trisStock: 0.5,    // M, pH 6.8 (or 1.0M with 0.125 vol fraction)
    trisConc: 1.0,     // M stock concentration
    trisVolFrac: 0.125,// fraction giving 125 mM final
    sdsVolFrac: 0.01,
    apsVolFrac: 0.01,
    temedPerMl: 0.001,
    acrylamideStock: 30,
    percentage: 4,
  }
};

function calcGel(percentage, totalVolume, type='resolving') {
  const cfg = GEL_DEFAULTS[type];
  const acryVol = (percentage / cfg.acrylamideStock) * totalVolume;
  let trisVol;
  if (type === 'resolving') {
    trisVol = cfg.trisVolFrac * totalVolume;
  } else {
    trisVol = (0.125 / cfg.trisConc) * totalVolume;
  }
  const sdsVol = cfg.sdsVolFrac * totalVolume;
  const apsVol = cfg.apsVolFrac * totalVolume;
  const temedVol = cfg.temedPerMl * totalVolume;
  const h2o = totalVolume - acryVol - trisVol - sdsVol - apsVol - temedVol;
  
  const trisLabel = type === 'resolving'
    ? '1.5 M Tris-HCl pH 8.8'
    : '1.0 M Tris-HCl pH 6.8';
  
  return [
    { name: 'ddH₂O', vol: Math.max(0, h2o), unit: 'mL' },
    { name: `30% Acrylamide/Bis (29:1)`, vol: acryVol, unit: 'mL' },
    { name: trisLabel, vol: trisVol, unit: 'mL' },
    { name: '10% SDS', vol: sdsVol, unit: 'mL' },
    { name: '10% APS (新鲜配制)', vol: apsVol, unit: 'mL' },
    { name: 'TEMED', vol: temedVol * 1000, unit: 'µL' },
  ];
}

// Parse chemical formula into element counts
function parseFormula(formula) {
  // Normalize subscript characters
  const sub = {'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9'};
  let f = formula.replace(/[₀-₉]/g, c => sub[c] || c);
  function parse(s, i) {
    const counts = {};
    while (i < s.length) {
      if (s[i] === '(') {
        const [inner, ni] = parse(s, i + 1);
        i = ni;
        let numStr = '';
        while (i < s.length && /\d/.test(s[i])) { numStr += s[i]; i++; }
        const mult = numStr ? parseInt(numStr) : 1;
        for (const el in inner) counts[el] = (counts[el] || 0) + inner[el] * mult;
      } else if (s[i] === ')') {
        return [counts, i + 1];
      } else if (/[A-Z]/.test(s[i])) {
        let sym = s[i]; i++;
        while (i < s.length && /[a-z]/.test(s[i])) { sym += s[i]; i++; }
        let numStr = '';
        while (i < s.length && /\d/.test(s[i])) { numStr += s[i]; i++; }
        const n = numStr ? parseInt(numStr) : 1;
        counts[sym] = (counts[sym] || 0) + n;
      } else {
        i++;
      }
    }
    return [counts, i];
  }
  const [counts] = parse(f, 0);
  return counts;
}

function calcMW(formula) {
  const counts = parseFormula(formula);
  let total = 0;
  const breakdown = [];
  for (const sym in counts) {
    const el = ELEMENT_BY_SYM[sym];
    if (!el) return { error: true, sym };
    const sub = el.mass * counts[sym];
    breakdown.push({ sym, name: el.name, count: counts[sym], mass: el.mass, subtotal: sub });
    total += sub;
  }
  return { total, breakdown, error: false };
}

// Parse time patterns in step text and return array of {text, seconds, label} matches
function parseTimePatternsFromText(text) {
  const matches = [];
  // Skip entire text if it's a PCR cycling line (contains °C + cycles/×)
  if (/°C/.test(text) && /[×x]\s*\d+|cycles?|\d+\s*轮/i.test(text)) return matches;
  // Skip centrifuge lines (×g or rpm with no actionable timer)
  if (/\d+\s*[×x]\s*g\b/i.test(text) && !/\d+\s*(min|h|s|分|秒|小时)/i.test(text)) return matches;
  // Skip ratio patterns like 28S/18S, A260/280
  const cleaned = text.replace(/\d+S\/\d+S/g, '').replace(/A\d+\/\d+/g, '');
  // English time regex — captures optional range (takes the LAST/max number before unit)
  const enRegex = /(?:(\d+(?:\.\d+)?)\s*[-–]\s*)?(\d+(?:\.\d+)?)\s*(min(?:utes?)?|h(?:ours?|rs?)?|s(?:ec(?:onds?)?)?)\b/gi;
  // Chinese time regex — same range-aware pattern
  const zhRegex = /(?:(\d+(?:\.\d+)?)\s*[-–]\s*)?(\d+(?:\.\d+)?)\s*(分钟|分|小时|秒)/g;
  let m;
  while ((m = enRegex.exec(cleaned)) !== null) {
    // Skip approximate/informational markers
    const before = cleaned.slice(Math.max(0, m.index - 10), m.index);
    if (/[~≈约大约]/.test(before) || /about|approx/i.test(before)) continue;
    // Skip sonication on/off patterns (e.g., "30s on/30s off")
    const after = cleaned.slice(m.index + m[0].length, m.index + m[0].length + 10);
    if (/^\s*(on|off)\b/i.test(after)) continue;
    // Use max of range (group 2) or single value
    const val = parseFloat(m[2]);
    const unit = m[3].toLowerCase();
    let seconds;
    if (unit.startsWith('h')) seconds = val * 3600;
    else if (unit.startsWith('s')) seconds = val;
    else seconds = val * 60;
    if (seconds >= 5 && seconds <= 86400) {
      matches.push({ seconds, label: m[0].trim() });
    }
  }
  while ((m = zhRegex.exec(cleaned)) !== null) {
    const before = cleaned.slice(Math.max(0, m.index - 10), m.index);
    if (/[~≈约大约]/.test(before)) continue;
    const val = parseFloat(m[2]);
    const unit = m[3];
    let seconds;
    if (unit === '小时') seconds = val * 3600;
    else if (unit === '秒') seconds = val;
    else seconds = val * 60;
    if (seconds >= 5 && seconds <= 86400 && !matches.some(x => x.seconds === seconds)) {
      matches.push({ seconds, label: m[0].trim() });
    }
  }
  return matches;
}

function RecipeDetail({ recipe, onNavigateRecipe, onCrossNavigate, onEditCustom, onDeleteCustom }) {
  const lang = useLang();
  const toast = useToast();
  const { addTimer } = useTimers();
  const [targetVol, setTargetVol] = useState(recipe.defaultVolume);
  const [showDetailed, setShowDetailed] = useState(false);
  const scale = targetVol / recipe.defaultVolume;
  const isProtocol = recipe.category === 'protocol';
  const hasStepToggle = recipe.briefSteps && recipe.detailedSteps;

  // Step tracker state (persisted in localStorage per recipe)
  const storageKey = 'stepTracker_' + recipe.id;
  const [completedSteps, setCompletedSteps] = useState(() => {
    try { const s = localStorage.getItem(storageKey); return s ? new Set(JSON.parse(s)) : new Set(); }
    catch { return new Set(); }
  });

  useEffect(() => {
    setTargetVol(recipe.defaultVolume);
    setShowDetailed(false);
    // Load step tracker for new recipe
    try { const s = localStorage.getItem('stepTracker_' + recipe.id); setCompletedSteps(s ? new Set(JSON.parse(s)) : new Set()); }
    catch { setCompletedSteps(new Set()); }
  }, [recipe.id]);

  const toggleStep = (idx) => {
    setCompletedSteps(prev => {
      const next = new Set(prev);
      if (next.has(idx)) next.delete(idx); else next.add(idx);
      localStorage.setItem(storageKey, JSON.stringify([...next]));
      return next;
    });
  };
  const resetSteps = () => {
    setCompletedSteps(new Set());
    localStorage.removeItem(storageKey);
  };

  // Find related protocol names (memoized — RECIPES lookup is O(n) per id)
  const relatedProtos = useMemo(() =>
    (recipe.relatedProtocols || []).map(pid => RECIPE_BY_ID[pid]).filter(Boolean),
    [recipe.id]
  );

  return (
    <div className="card p-6 fade-in">
      <div className="flex items-start justify-between mb-3">
        <div>
          <h2 className="text-xl font-bold">{recipe.name}</h2>

        </div>
        {recipe._isCustom && onEditCustom && (
          <div className="flex items-center gap-2 flex-shrink-0">
            <button onClick={() => onEditCustom(recipe)} className="px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-all"
              style={{background:'var(--primary-light)', color:'var(--primary)', border:'1px solid var(--border)'}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={S_INLINE_ICON}><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              {t('editCustom', lang)}
            </button>
            <button onClick={() => { if (window.confirm(t('deleteConfirm', lang))) onDeleteCustom(recipe); }}
              className="px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-all"
              style={{background:'var(--bg-2)', color:'var(--text-muted)', border:'1px solid var(--border)'}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={S_INLINE_ICON}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
              {t('deleteCustom', lang)}
            </button>
          </div>
        )}
      </div>

      {/* Usage description */}
      {recipe.usage && (
        <div className="mb-4 p-3 rounded-lg text-sm" style={{background:'var(--bg-2)', color:'var(--text)', borderLeft:'3px solid var(--primary)'}}>
          {recipe.usage[lang] || recipe.usage.zh}

      {/* Related protocols */}

          <span className="text-xs font-semibold" style={S_MUTED}>
            {lang === 'en' ? 'Used in:' : '相关实验:'}

          {relatedProtos.map(p => (

                {lang === 'en' ? 'Detailed' : '详细'}

          </div>

          {!showDetailed ? (
            <div className="p-3 rounded-lg text-sm" style={{background:'var(--bg-2)', borderLeft:'3px solid var(--primary)'}}>
              {recipe.briefSteps.map((s, i) => (
                <p key={i} className="leading-relaxed">{s[lang] || s.zh}</p>

          <h4 className="text-sm font-bold mb-2" style={S_TEXT}>

              </div>
            ))}
          </div>
        </div>
      )}

      {(NOTES_EN[recipe.id] || recipe.notes) && (
        <div className="mt-4 p-3 rounded-lg bg-amber-50 border border-amber-200">
          <p className="text-xs text-amber-800"><strong>{t('tip', lang)}:</strong> {lang === 'en' && NOTES_EN[recipe.id] ? NOTES_EN[recipe.id] : getRecipeNotes(recipe, lang)}</p>
        </div>
      )}
      {recipe.ref && <div className="mt-3 text-[11px] italic" style={S_MUTED}>
        Ref: {recipe.ref}
      </div>}
      <div className="mt-4 pt-3 border-t flex gap-2" style={S_BORDER}>
        <DownloadBtn small label={t('downloadTxt', lang)}
          onClick={() => { downloadFile(recipe.id + '.txt', recipeToText(recipe, targetVol, lang)); toast.show(t('downloaded', lang)); }} />
        <DownloadBtn small label={t('copyClipboard', lang)}
          onClick={() => { navigator.clipboard.writeText(recipeToText(recipe, targetVol, lang)); toast.show(t('copied', lang)); }} />
      </div>
    </div>
  );
}

            </div>
          </div>
        ) : (

// --- Unit Conversion Calculator ---
function UnitConversionCalc() {
  const lang = useLang();
  const categories = {
    volume: {
      label: () => t('convertCatVolume', lang),
      units: ['L', 'mL', 'µL', 'nL', 'fl oz', 'cup', 'pt', 'qt', 'gal'],
      toBase: { L: 1, mL: 1e-3, 'µL': 1e-6, nL: 1e-9, 'fl oz': 0.0295735, cup: 0.236588, pt: 0.473176, qt: 0.946353, gal: 3.78541 },
    },
    mass: {
      label: () => t('convertCatMass', lang),
      units: ['kg', 'g', 'mg', 'µg', 'ng', 'lb', 'oz'],
      toBase: { kg: 1000, g: 1, mg: 1e-3, 'µg': 1e-6, ng: 1e-9, lb: 453.592, oz: 28.3495 },
    },
    length: {
      label: () => t('convertCatLength', lang),
      units: ['m', 'cm', 'mm', 'µm', 'nm', 'in', 'ft', 'yd'],
      toBase: { m: 1, cm: 0.01, mm: 0.001, 'µm': 1e-6, nm: 1e-9, 'in': 0.0254, ft: 0.3048, yd: 0.9144 },
    },
    temperature: {
      label: () => t('convertCatTemp', lang),
      units: ['°C', '°F', 'K'],
      convert: (val, from, to) => {
        let c;
        if (from === '°C') c = val;
        else if (from === '°F') c = (val - 32) * 5/9;
        else c = val - 273.15;
        if (to === '°C') return c;
        if (to === '°F') return c * 9/5 + 32;
        return c + 273.15;
      }
    },
    pressure: {
      label: () => t('convertCatPressure', lang),
      units: ['atm', 'Pa', 'kPa', 'bar', 'psi', 'mmHg', 'Torr'],
      toBase: { atm: 1, Pa: 9.8692e-6, kPa: 0.00986923, bar: 0.986923, psi: 0.068046, mmHg: 0.00131579, Torr: 0.00131579 },
    },
  };

  const [cat, setCat] = useState('volume');
  const [fromUnit, setFromUnit] = useState('mL');
  const [toUnit, setToUnit] = useState('µL');
  const [value, setValue] = useState('');

  const catData = categories[cat];
  const numVal = parseFloat(value);
  let result = null;
  if (!isNaN(numVal) && value !== '') {
    if (catData.convert) {
      result = catData.convert(numVal, fromUnit, toUnit);
    } else {
      result = numVal * catData.toBase[fromUnit] / catData.toBase[toUnit];
    }
  }

  function fmt(n) {
    if (n === null || n === undefined) return '—';
    if (Math.abs(n) < 0.0001 && n !== 0) return n.toExponential(4);
    if (Math.abs(n) >= 1e7) return n.toExponential(4);
    return parseFloat(n.toPrecision(8)).toString();
  }

  return (
    <div className="fade-in">
      <div className="card p-5">
        <h3 className="text-sm font-bold mb-1">{t('calcTaskConvert', lang)}</h3>
        <p className="text-xs mb-4" style={S_MUTED}>
          {lang === 'en' ? 'Convert between metric, imperial, and lab units' : '公制、英制和实验室单位互转'}
        </p>
        <div className="mb-4">
          <label className="text-xs font-semibold block mb-1" style={S_MUTED}>{t('convertCategory', lang)}</label>
          <div className="flex gap-1.5 flex-wrap">
            {Object.keys(categories).map(k => (
              <button key={k} onClick={() => { setCat(k); setFromUnit(categories[k].units[0]); setToUnit(categories[k].units[1]); setValue(''); }}
                className="px-3 py-1.5 rounded-full text-xs font-semibold transition-all"
                style={{
                  background: cat === k ? 'var(--primary)' : 'var(--card)',
                  color: cat === k ? 'white' : 'var(--text-muted)',
                  border: `1px solid ${cat === k ? 'var(--primary)' : 'var(--border)'}`,
                }}>
                {categories[k].label()}
              </button>
            ))}
          </div>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
          <div>
            <label className="text-xs font-semibold block mb-1" style={S_MUTED}>{t('convertFrom', lang)}</label>
            <div className="flex gap-2">
              <input type="number" value={value} onChange={e => setValue(e.target.value)}
                placeholder="0" step="any" className="flex-1" />
              <select value={fromUnit} onChange={e => setFromUnit(e.target.value)} style={{width:'4.5rem', flexShrink:0}}>
                {catData.units.map(u => <option key={u} value={u}>{u}</option>)}
              </select>
            </div>
          </div>
          <div className="flex items-center justify-center text-lg" style={S_MUTED}>→</div>
          <div>
            <label className="text-xs font-semibold block mb-1" style={S_MUTED}>{t('convertTo', lang)}</label>
            <div className="flex gap-2 items-center">
              <div className="flex-1 p-2 rounded-lg text-center" style={{background:'var(--primary-light)', minHeight:'2.5rem'}}>
                <span className="text-xl font-bold mono" style={S_PRIMARY}>
                  {result !== null ? fmt(result) : '—'}
                </span>
              </div>
              <select value={toUnit} onChange={e => setToUnit(e.target.value)} style={{width:'4.5rem', flexShrink:0}}>
                {catData.units.map(u => <option key={u} value={u}>{u}</option>)}
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// --- Interactive Periodic Table ---
function PeriodicTableCalc() {
  const lang = useLang();
  const [selected, setSelected] = useState(null);
  const [search, setSearch] = useState('');

  const filteredZ = search.trim() ? ELEMENTS.filter(el =>
    el.sym.toLowerCase().includes(search.toLowerCase()) ||
    el.name.toLowerCase().includes(search.toLowerCase()) ||
    String(el.z) === search.trim()
  ).map(el => el.z) : null;

  // Build grid: 10 rows x 18 cols
  const grid = Array.from({length: 10}, () => Array(18).fill(null));
  ELEMENTS.forEach(el => {
    const pos = PT_LAYOUT[el.z];
    if (pos) grid[pos[0]][pos[1]] = el;
  });

  const catLabels = {
    'alkali': 'Alkali Metal', 'alkaline-earth': 'Alkaline Earth', 'transition': 'Transition Metal',
    'post-transition': 'Post-Transition', 'metalloid': 'Metalloid', 'nonmetal': 'Nonmetal',
    'halogen': 'Halogen', 'noble-gas': 'Noble Gas', 'lanthanide': 'Lanthanide', 'actinide': 'Actinide',
  };

  return (
    <div className="card p-5 fade-in">
      <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
        <div>
          <h2 className="text-xl font-bold mb-1">{t('periodicTitle', lang)}</h2>
          <p className="text-sm" style={{color:'var(--text-muted)'}}>{t('periodicSubtitle', lang)}</p>
        </div>
        <input type="text" value={search} onChange={e => setSearch(e.target.value)}
          placeholder={t('periodicSearch', lang)}
          className="w-48 text-sm" />
      </div>

      {/* Legend */}
      <div className="flex flex-wrap gap-2 mb-3">
        {Object.entries(ELEMENT_CAT_COLORS).map(([cat, color]) => (
          <div key={cat} className="flex items-center gap-1 text-[10px]">
            <div className="w-3 h-3 rounded" style={{background: color}} />
            <span style={{color:'var(--text-muted)'}}>{catLabels[cat]}</span>
          </div>

      </div>

      {/* Periodic Table Grid */}
      <div className="overflow-x-auto pb-2">
        <div style={{display:'inline-grid', gridTemplateColumns:'repeat(18, 1fr)', gap: 2, minWidth: 620}}>
          {grid.map((row, ri) => (
            <React.Fragment key={ri}>
              {ri === 7 && <div style={{gridColumn:'1 / -1', height: 6}} />}
              {row.map((el, ci) => {
                if (!el) return <div key={`${ri}-${ci}`} style={{width: 34, height: 38}} />;
                const dimmed = filteredZ && !filteredZ.includes(el.z);
                const isSelected = selected && selected.z === el.z;
                return (
                  <div key={el.z}
                    onClick={() => setSelected(el)}
                    title={`${el.name} (${el.mass})`}
                    className="cursor-pointer transition-all rounded"
                    style={{
                      width: 34, height: 38, padding: '1px 2px',
                      background: isSelected ? 'var(--primary)' : (ELEMENT_CAT_COLORS[el.cat] || '#adb5bd') + (dimmed ? '30' : 'cc'),
                      color: isSelected ? 'white' : dimmed ? 'var(--text-muted)' : '#1a1a2e',
                      border: isSelected ? '2px solid var(--primary)' : '1px solid ' + (dimmed ? 'transparent' : 'rgba(0,0,0,0.1)'),
                      opacity: dimmed ? 0.4 : 1,
                      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
                      lineHeight: 1.1, fontSize: 9, fontWeight: 600,
                    }}>
                    <span style={{fontSize: 7, opacity: 0.7}}>{el.z}</span>
                    <span style={{fontSize: 12, fontWeight: 800, fontFamily: 'var(--font-mono)'}}>{el.sym}</span>
                    <span style={{fontSize: 6, opacity: 0.7}}>{el.mass.toFixed(1)}</span>
                  </div>

        </div>

      {/* Selected element details */}

              <div className="text-xs font-semibold">{selected.name}</div>
              <div className="text-[10px] mono mt-0.5">{selected.mass.toFixed(3)}</div>

function DilutionCalc() {
  const lang = useLang();
  const [c1, setC1] = useState('');
  const [v1, setV1] = useState('');
  const [c2, setC2] = useState('');
  const [v2, setV2] = useState('');
  const [solve, setSolve] = useState('v1');
  const [c1Unit, setC1Unit] = useState('M');
  const [v1Unit, setV1Unit] = useState('mL');
  const [c2Unit, setC2Unit] = useState('M');
  const [v2Unit, setV2Unit] = useState('mL');

  const unitFactorsC = { M: 1, mM: 1e-3, µM: 1e-6, nM: 1e-9, '%': 1 };
  const unitFactorsV = { L: 1, mL: 1e-3, µL: 1e-6 };

  function calculate() {
    const C1 = +c1 * unitFactorsC[c1Unit];
    const V1 = +v1 * unitFactorsV[v1Unit];
    const C2 = +c2 * unitFactorsC[c2Unit];
    const V2 = +v2 * unitFactorsV[v2Unit];

    if (solve === 'v1' && C1 && C2 && V2) return { val: (C2 * V2) / C1 / unitFactorsV[v1Unit], unit: v1Unit, label: 'V₁' };
    if (solve === 'c1' && V1 && C2 && V2) return { val: (C2 * V2) / V1 / unitFactorsC[c1Unit], unit: c1Unit, label: 'C₁' };
    if (solve === 'v2' && C1 && V1 && C2) return { val: (C1 * V1) / C2 / unitFactorsV[v2Unit], unit: v2Unit, label: 'V₂' };
    if (solve === 'c2' && C1 && V1 && V2) return { val: (C1 * V1) / V2 / unitFactorsC[c2Unit], unit: c2Unit, label: 'C₂' };
    return null;
  }

  const result = calculate();

  function InputRow({ label, desc, value, setValue, disabled, unit, setUnit, units, isSolveTarget }) {
    return (
      <div className={`p-3 rounded-lg ${isSolveTarget ? 'bg-primary-light border-2 border-primary' : 'bg-gray-50'}`}>
        <div className="flex items-center gap-2 mb-1">
          <span className="font-bold mono text-base">{label}</span>
          {desc && <span className="text-xs" style={S_MUTED}>{desc}</span>}
        </div>
        <div className="flex items-center gap-2">
          <span className="text-gray-400">=</span>
          {isSolveTarget ? (
            <div className="flex-1 text-center">
              {result ? (
                <span className="text-xl font-bold mono" style={S_PRIMARY}>
                  {result.val < 0.001 ? result.val.toExponential(3) : result.val.toFixed(4)}
                </span>
              ) : (
                <span className="text-gray-400 text-sm">{t('enterOther3', lang)}</span>
              )}
            </div>
          ) : (
            <input type="number" value={value} onChange={e => setValue(e.target.value)}
              className="flex-1" placeholder="0" step="any" style={{minWidth: 0}} />
          )}
          <select value={unit} onChange={e => setUnit(e.target.value)} style={{width:'4.5rem', flexShrink: 0}}>
            {units.map(u => <option key={u} value={u}>{u}</option>)}
          </select>
        </div>
      </div>
    );
  }

  const concUnits = ['M', 'mM', 'µM', 'nM', '%'];
  const volUnits = ['L', 'mL', 'µL'];

  return (
    <div className="card p-6">
      <div className="flex items-center justify-between mb-4">
        <h3 className="text-sm font-bold">{t('dilutionFormula', lang)}</h3>
        <div className="flex items-center gap-2 text-sm">
          <span style={S_MUTED}>{t('solveFor', lang)}:</span>
          {['c1','v1','c2','v2'].map(s => (
            <button key={s} onClick={() => setSolve(s)}
              className={`px-2.5 py-1 rounded-md mono font-bold text-xs transition-all ${
                solve === s ? 'bg-primary text-white' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'
              }`}>{s === 'c1' ? 'C₁' : s === 'v1' ? 'V₁' : s === 'c2' ? 'C₂' : 'V₂'}</button>
          ))}
        </div>
      </div>

      <div className="space-y-3">
        <InputRow label="C₁" desc={t('dilC1Desc', lang)} value={c1} setValue={setC1} unit={c1Unit} setUnit={setC1Unit} units={concUnits} isSolveTarget={solve==='c1'} />
        <InputRow label="V₁" desc={t('dilV1Desc', lang)} value={v1} setValue={setV1} unit={v1Unit} setUnit={setV1Unit} units={volUnits} isSolveTarget={solve==='v1'} />
        <div className="text-center mono text-gray-300 text-lg">=</div>
        <InputRow label="C₂" desc={t('dilC2Desc', lang)} value={c2} setValue={setC2} unit={c2Unit} setUnit={setC2Unit} units={concUnits} isSolveTarget={solve==='c2'} />
        <InputRow label="V₂" desc={t('dilV2Desc', lang)} value={v2} setValue={setV2} unit={v2Unit} setUnit={setV2Unit} units={volUnits} isSolveTarget={solve==='v2'} />
      </div>

      {result && (
        <div className="mt-4 p-4 rounded-lg border-2 border-primary bg-primary-light text-center">
          <p className="text-sm" style={S_MUTED}>{t('result', lang)}</p>
          <p className="text-2xl font-bold mono" style={S_PRIMARY}>
            {result.label} = {result.val < 0.001 ? result.val.toExponential(3) : result.val.toFixed(4)} {result.unit}
          </p>
        </div>
      )}
      {result && (() => {
        const fmtVal = (v) => v < 0.001 ? v.toExponential(3) : v.toFixed(4);
        let prep = null;
        if (solve === 'v1') {
          const solventVol = +v2 - result.val;
          if (solventVol > 0) {
            prep = (<p className="text-sm" style={S_TEXT}>
              {t('dilPrepPipette', lang)} <strong>{fmtVal(result.val)} {v1Unit}</strong> {t('dilPrepStock', lang)}{lang === 'zh' ? '，' : ', '}
              {t('dilPrepAdd', lang)} <strong>{fmtVal(solventVol)} {v2Unit}</strong> {t('dilPrepSolvent', lang)}{lang === 'zh' ? '，' : ' '}
              {t('dilPrepReach', lang)} <strong>{(+v2).toFixed(4)} {v2Unit}</strong> {t('dilPrepTotal', lang)}
            </p>);
          }
        } else if (solve === 'v2') {
          const v1Val = +v1;
          const solventVol = result.val - v1Val;
          if (solventVol > 0) {
            prep = (<p className="text-sm" style={S_TEXT}>
              {t('dilPrepPipette', lang)} <strong>{fmtVal(v1Val)} {v1Unit}</strong> {t('dilPrepStock', lang)}{lang === 'zh' ? '，' : ', '}
              {t('dilPrepAdd', lang)} <strong>{fmtVal(solventVol)} {v2Unit}</strong> {t('dilPrepSolvent', lang)}{lang === 'zh' ? '，' : ' '}
              {t('dilPrepReach', lang)} <strong>{fmtVal(result.val)} {v2Unit}</strong> {t('dilPrepTotal', lang)}
            </p>);
          }
        } else if (solve === 'c2') {
          prep = (<p className="text-sm" style={S_TEXT}>
            {t('dilPrepDilute', lang)} <strong>{fmtVal(result.val)} {c2Unit}</strong>{lang === 'zh' ? '，' : ', '}
            {t('dilPrepUsing', lang)} <strong>{(+v1).toFixed(4)} {v1Unit}</strong> {t('dilPrepStock', lang)}{lang === 'zh' ? '，' : ' → '}
            <strong>{(+v2).toFixed(4)} {v2Unit}</strong> {t('dilPrepFinalVol', lang)}
          </p>);
        } else if (solve === 'c1') {
          prep = (<p className="text-sm" style={S_TEXT}>
            {t('dilPrepNeedStock', lang)} <strong>{fmtVal(result.val)} {c1Unit}</strong>{lang === 'zh' ? '，' : ' '}
            {t('dilPrepToGet', lang)} <strong>{(+c2).toFixed(4)} {c2Unit}</strong>{lang === 'zh' ? '，' : ', '}
            {t('dilPrepFrom', lang)} <strong>{(+v1).toFixed(4)} {v1Unit}</strong> → <strong>{(+v2).toFixed(4)} {v2Unit}</strong>
          </p>);
        }
        return prep ? (
          <div className="mt-3 p-3 rounded-lg" style={{background:'var(--accent-light)', border:'1px solid var(--border)'}}>
            <p className="text-xs font-semibold mb-1" style={S_MUTED}>{t('dilPrepSummary', lang)}</p>
            {prep}
          </div>
        ) : null;
      })()}
    </div>
  );
}

function MolarityCalc() {
  const lang = useLang();

  const [massUnit, setMassUnit] = useState('g');

  const massFactors = { g: 1, mg: 1e-3, µg: 1e-6 };
  const volFactors = { L: 1, mL: 1e-3, µL: 1e-6 };

  const molarity = (+mass && +mw && +vol)
    ? (+mass * massFactors[massUnit]) / +mw / (+vol * volFactors[volUnit])
    : null;

  function formatConc(M) {
    if (M >= 1) return { val: M.toFixed(4), unit: 'M' };
    if (M >= 1e-3) return { val: (M * 1e3).toFixed(4), unit: 'mM' };
    if (M >= 1e-6) return { val: (M * 1e6).toFixed(4), unit: 'µM' };
    return { val: (M * 1e9).toFixed(4), unit: 'nM' };

  return (
    <div className="card p-6 max-w-2xl">

            <input type="number" value={mass} onChange={e => setMass(e.target.value)} placeholder="0" step="any" className="flex-1" style={{minWidth:0}} />
            <select value={massUnit} onChange={e => setMassUnit(e.target.value)} style={{width:'4.5rem', flexShrink:0}}>
              <option>g</option><option>mg</option><option>µg</option>
            </select>
          </div>
        </div>
        <div>
          <label className="text-xs font-semibold block mb-1" style={S_MUTED}>{t('mwLabel', lang)}</label>
          <p className="text-xs mb-1" style={S_MUTED_DIM}>{t('molMwDesc', lang)}</p>
          <input type="number" value={mw} onChange={e => setMw(e.target.value)} placeholder="e.g. 58.44" step="any" />
        </div>
        <div>
          <label className="text-xs font-semibold block mb-1" style={S_MUTED}>{t('solnVolume', lang)} V</label>
          <p className="text-xs mb-1" style={S_MUTED_DIM}>{t('molVolDesc', lang)}</p>
          <div className="flex gap-2 items-center">
            <input type="number" value={vol} onChange={e => setVol(e.target.value)} placeholder="0" step="any" className="flex-1" style={{minWidth:0}} />
            <select value={volUnit} onChange={e => setVolUnit(e.target.value)} style={{width:'4.5rem', flexShrink:0}}>
              <option>L</option><option>mL</option><option>µL</option>
            </select>
          </div>
        </div>
      </div>
      {molarity !== null && (
        <div className="mt-5 p-4 rounded-lg border-2 border-accent bg-accent-light text-center">
          <p className="text-sm mb-1" style={S_MUTED}>{t('molConc', lang)}</p>
          <p className="text-2xl font-bold mono" style={{color:'var(--accent)'}}>
            {formatConc(molarity).val} {formatConc(molarity).unit}
          </p>
          <p className="text-xs text-gray-500 mt-1 mono">= {molarity.toExponential(4)} M</p>
        </div>
      )}
    </div>
  );
}

function PercentCalc() {
  const lang = useLang();
  const [solute, setSolute] = useState('');
  const [vol, setVol] = useState('');
  const [perc, setPerc] = useState('');
  const [mode, setMode] = useState('wv'); // wv or vv
  const [solve, setSolve] = useState('solute'); // solute, vol, perc

  let result = null;
  if (solve === 'solute' && +vol && +perc) {
    result = { val: (+perc / 100) * +vol, label: mode === 'wv' ? t('soluteMass', lang) : t('soluteVol', lang), unit: mode === 'wv' ? 'g' : 'mL' };
  } else if (solve === 'vol' && +solute && +perc) {
    result = { val: +solute / (+perc / 100), label: t('finalVol', lang), unit: 'mL' };
  } else if (solve === 'perc' && +solute && +vol) {
    result = { val: (+solute / +vol) * 100, label: t('percentConc', lang), unit: '%' };
  }

  return (
    <div className="card p-6 max-w-2xl">
      <h3 className="text-sm font-bold mb-1">{t('percentCalcTitle', lang)}</h3>
      <div className="flex gap-3 mb-4">
        <button onClick={() => setMode('wv')}
          className="px-4 py-1.5 rounded-lg text-sm font-semibold"
          style={{background: mode === 'wv' ? 'var(--primary)' : 'var(--bg-2)', color: mode === 'wv' ? 'white' : 'var(--text-muted)'}}>

  const presets = [

    { id: 'wb', label: 'WB Loading', n: '10', vol: '25', unit: 'µL', dead: '20' },
    { id: '96well', label: '96-well plate', n: '96', vol: '200', unit: 'µL', dead: '10' },
    { id: 'transfection', label: lang === 'en' ? 'Transfection' : '转染', n: '6', vol: '500', unit: 'µL', dead: '20' },
    { id: 'mastermix', label: 'Master Mix', n: '48', vol: '50', unit: 'µL', dead: '25' },

            placeholder="e.g. 24" min="1" step="1"
            className="w-full px-3 py-2 rounded-lg text-sm"
            style={{background:'var(--card)', border:'1px solid var(--border)', color:'var(--text)'}} />
        </div>

        <div className="p-3 rounded-lg" style={S_BG2}>
          <label className="text-xs font-semibold block mb-1" style={S_MUTED}>{t('volPerSample', lang)}</label>
          <div className="flex gap-2 items-center">
            <input type="number" value={volPer} onChange={e => { setVolPer(e.target.value); setPreset('custom'); }}
              placeholder="e.g. 200" min="0" step="any"
              className="flex-1 px-3 py-2 rounded-lg text-sm"
              style={{background:'var(--card)', border:'1px solid var(--border)', color:'var(--text)', minWidth:0}} />
            <select value={volUnit} onChange={e => setVolUnit(e.target.value)}

          <label className="text-xs font-semibold block mb-1" style={S_MUTED}>
            {t('deadVolPercent', lang)}: <span className="mono font-bold" style={S_PRIMARY}>{deadPct}%</span>
          </label>
          <input type="range" min="0" max="50" step="1" value={deadPct}

          <p className="text-2xl font-bold mono" style={S_PRIMARY}>
            {displayTotal.val} {displayTotal.unit}
          </p>
          <div className="flex gap-4 mt-2 text-xs" style={S_MUTED}>
            <span>{t('withoutDead', lang)}: <span className="mono font-bold">{base.toFixed(1)} {volUnit}</span></span>
            <span>{t('deadVolAmount', lang)}: <span className="mono font-bold">+{deadAmt.toFixed(1)} {volUnit}</span></span>
          </div>
          <p className="text-xs mt-2 italic" style={S_MUTED}>
            = {n} × {v} {volUnit} × (1 + {d}%)

      <div className="mt-4 p-3 rounded-lg text-xs" style={{background:'var(--accent-light)', color:'var(--accent)'}}>
        {t('deadVolTip', lang)}
      </div>
    </div>
  );
}

// --- Protocol Timer System ---
const TimerContext = React.createContext();
function TimerProvider({ children }) {
  const [timers, setTimers] = useState([]);

  const addTimer = (label, seconds) => {
    const id = Date.now() + Math.random();
    setTimers(prev => [...prev, { id, label, totalSeconds: seconds, remaining: seconds, running: true, startedAt: Date.now() }]);
    return id;
  };

  const removeTimer = (id) => {
    setTimers(prev => {
      const next = prev.filter(t => t.id !== id);
      // Close AudioContext when no timers remain
      if (next.length === 0 && audioCtxRef.current) {
        audioCtxRef.current.close().catch(() => {});
        audioCtxRef.current = null;
      }
      return next;
    });
  };
  const pauseTimer = (id) => setTimers(prev => prev.map(t => t.id === id ? {...t, running: false} : t));
  const resumeTimer = (id) => setTimers(prev => prev.map(t => t.id === id ? {...t, running: true} : t));
  const resetTimer = (id) => setTimers(prev => prev.map(t => t.id === id ? {...t, remaining: t.totalSeconds, running: false} : t));

  const audioCtxRef = React.useRef(null);
  const hasRunning = timers.some(t => t.running && t.remaining > 0);

  React.useEffect(() => {
    if (!hasRunning) return; // No interval when no active timers
    const interval = setInterval(() => {
      setTimers(prev => prev.map(tmr => {
        if (!tmr.running || tmr.remaining <= 0) return tmr;
        const next = tmr.remaining - 1;
        if (next <= 0) {
          // Play alert sound (reuse AudioContext)
          try {
            if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
            const ctx = audioCtxRef.current;
            [0, 0.3, 0.6].forEach(delay => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.connect(gain); gain.connect(ctx.destination);
              osc.frequency.value = 880;
              osc.type = 'sine';
              gain.gain.value = 0.3;
              osc.start(ctx.currentTime + delay);
              osc.stop(ctx.currentTime + delay + 0.15);
            });
          } catch(e) {}
          // Browser notification
          if (Notification.permission === 'granted') {
            new Notification('Timer Done!', { body: tmr.label, icon: '🧪' });
          } else if (Notification.permission !== 'denied') {
            Notification.requestPermission();
          }
        }
        return {...tmr, remaining: Math.max(0, next), running: next > 0 ? true : false};
      }));
    }, 1000);
    return () => clearInterval(interval);
  }, [hasRunning]);

  return React.createElement(TimerContext.Provider, { value: { timers, addTimer, removeTimer, pauseTimer, resumeTimer, resetTimer } }, children);
}

function TimerBar() {
  const lang = useLang();
  const { timers, removeTimer, pauseTimer, resumeTimer, resetTimer } = useTimers();
  const active = timers.filter(t => t.remaining > 0 || t.running);
  const done = timers.filter(t => t.remaining <= 0 && !t.running);

  if (timers.length === 0) return null;

  const fmtTime = (s) => {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${sec.toString().padStart(2, '0')}`;
  };

  return (
    <div className="fixed bottom-4 right-4 z-50 space-y-2" style={{maxWidth:'320px'}}>
      {active.map(tmr => {
        const pct = ((tmr.totalSeconds - tmr.remaining) / tmr.totalSeconds) * 100;
        return (
          <div key={tmr.id} className="rounded-xl p-3 shadow-lg" style={{background:'var(--card)', border:'1px solid var(--border)', backdropFilter:'blur(10px)'}}>
            <div className="flex items-center justify-between mb-1">
              <span className="text-xs font-semibold truncate" style={{color:'var(--text)', maxWidth:'160px'}}>{tmr.label}</span>
              <span className="mono text-sm font-bold" style={{color: tmr.remaining < 60 ? 'var(--accent)' : 'var(--primary)'}}>{fmtTime(tmr.remaining)}</span>
            </div>
            <div className="w-full h-1.5 rounded-full overflow-hidden" style={S_BG2}>
              <div className="h-full rounded-full transition-all" style={{width:`${pct}%`, background:'var(--primary)'}} />
            </div>
            <div className="flex gap-1 mt-2">
              {tmr.running ? (
                <button onClick={() => pauseTimer(tmr.id)} className="text-xs px-2 py-0.5 rounded" style={{background:'var(--bg-2)', color:'var(--text-muted)'}}>⏸</button>
              ) : (
                <button onClick={() => resumeTimer(tmr.id)} className="text-xs px-2 py-0.5 rounded" style={{background:'var(--primary-light)', color:'var(--primary)'}}>▶</button>
              )}
              <button onClick={() => resetTimer(tmr.id)} className="text-xs px-2 py-0.5 rounded" style={{background:'var(--bg-2)', color:'var(--text-muted)'}}>↺</button>
              <button onClick={() => removeTimer(tmr.id)} className="text-xs px-2 py-0.5 rounded" style={{background:'var(--accent-light)', color:'var(--accent)'}}>✕</button>
            </div>
          </div>
        );
      })}
      {done.map(tmr => (
        <div key={tmr.id} className="rounded-xl p-3 shadow-lg animate-pulse" style={{background:'var(--accent-light)', border:'2px solid var(--accent)'}}>
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold" style={{color:'var(--accent)'}}>{tmr.label} — {t('timerDone', lang)}</span>
            <button onClick={() => removeTimer(tmr.id)} className="text-xs px-2 py-0.5 rounded" style={{background:'var(--card)', color:'var(--text-muted)'}}>✕</button>
          </div>
        </div>
      ))}
    </div>
  );
}

function ToolsTab() {
  const lang = useLang();
  const toast = useToast();
  const [filter, setFilter] = useState('all');
  const cats = ['all', ...EXTERNAL_TOOLS.map(g => g.cat)];
  const fileInputRef = React.useRef(null);

  function handleExport() {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key.startsWith('labmate_') || key.startsWith('biolab_') || key.startsWith('stepProgress_') || key.startsWith('stepTracker_') || ['favs', 'lang', 'theme'].includes(key)) {
        try { data[key] = JSON.parse(localStorage.getItem(key)); }
        catch { data[key] = localStorage.getItem(key); }
      }
    }
    const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), appVersion: 'v0.1.0', data }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `labmate-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    localStorage.setItem('labmate_lastExport', String(Date.now()));
  }

  function handleImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.exportedAt || !parsed.data || typeof parsed.data !== 'object') {
          toast.show(t('importError', lang)); return;
        }
        const MERGE_ARRAY_KEYS = ['labmate_customRecipes', 'labmate_customProtocols'];
        let count = 0;
        Object.entries(parsed.data).forEach(([key, value]) => {
          if (MERGE_ARRAY_KEYS.includes(key)) {
            let existing = [];
            try { existing = JSON.parse(localStorage.getItem(key) || '[]'); } catch {}
            const incoming = Array.isArray(value) ? value : [];
            const merged = [...existing];
            const existingIds = new Set(existing.map(item => item.id));
            for (const item of incoming) {
              if (existingIds.has(item.id)) {
                const idx = merged.findIndex(m => m.id === item.id);
                if (idx >= 0) merged[idx] = item;
              } else {
                merged.push(item);
              }
            }
            localStorage.setItem(key, JSON.stringify(merged));
          } else {
            localStorage.setItem(key, typeof value === 'string' ? value : JSON.stringify(value));
          }
          count++;
        });
        toast.show(t('importSuccess', lang).replace('{n}', count));
        setTimeout(() => window.location.reload(), 500);
      } catch {
        toast.show(t('importError', lang));
      }
      if (fileInputRef.current) fileInputRef.current.value = '';
    };
    reader.readAsText(file);
  }

  return (
    <div className="fade-in">
      <div className="card p-5 mb-6">
        <h2 className="text-xl font-bold mb-1">{t('toolsTitle', lang)}</h2>
        <p className="text-sm mb-4" style={S_MUTED}>{t('toolsSubtitle', lang)}</p>
        <div className="flex flex-wrap gap-2">
          {cats.map(c => (
            <button key={c} onClick={() => setFilter(c)}
              className="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all"
              style={{
                background: filter === c ? 'var(--primary)' : 'var(--bg-2)',
                color: filter === c ? 'white' : 'var(--text-muted)',
              }}>
              {c === 'all' ? (lang === 'en' ? 'All' : '全部') : t(c, lang)}
            </button>
          ))}
        </div>
      </div>
      {EXTERNAL_TOOLS.filter(g => filter === 'all' || g.cat === filter).map(group => (
        <div key={group.cat} className="mb-6">
          <h3 className="text-sm font-bold mb-3 px-1" style={S_MUTED}>{t(group.cat, lang)}</h3>
          <div className="grid gap-3" style={{gridTemplateColumns:'repeat(auto-fill, minmax(280px, 1fr))'}}>
